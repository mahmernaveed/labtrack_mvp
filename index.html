        extend: {

<!-- Unified Dashboard — Laboratory persona -->

<script>

var qrcode = function() {

 

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

    }

        <p class="text-xs text-slate-500 dark:text-slate-400">Showing <span class="font-semibold text-slate-700 dark:text-slate-300">${from}&ndash;${to}</span> of <span class="font-semibold text-slate-700 dark:text-slate-300">${total}</span> ${label}</p>

  function StatusBadge(status) {

    if (status === 'assigned' && state.persona !== 'porters') {

    // Theatre and Porters see "Delivered" instead of "Received" — Lab keeps "Received".
    if (RECEIVED_STATUSES.includes(status) && (state.persona === 'theatre' || state.persona === 'porters')) {
      meta = { ...meta, label: 'Delivered' };

    return `<span class="badge ${meta.color}"><span class="w-1.5 h-1.5 rounded-full ${meta.dot}"></span>${meta.label}</span>`;
  }

  function PriorityBadge(priority) {

  }

  function BarChart(data, color = '#2563eb', height = 200) {
  const max = Math.max(...data.map(d => d.value), 1);
  const barWidth = 100 / data.length;

  let bars = '';

  data.forEach((d, i) => {
    const h = (d.value / max) * (height / 2 - 20);

    const x = i * barWidth + barWidth * 0.15;
    const y = height / 2 - h - 4;
    const width = barWidth * 0.7;

    bars += `
      <!-- Number above bar -->
      <text
        x="${x + width / 2}"
        y="${y - 3}"
        text-anchor="middle"
        font-size="5"
        fill="currentColor"
        class="text-slate-600 dark:text-slate-300 font-semibold"
      >
        ${d.value}
      </text>

      <!-- Bar -->
      <rect
        x="${x}"
        y="${y}"
        width="${width}"
        height="${h}"
        rx="0.5"
        fill="${color}"
        opacity="0.85"
      />
    `;
  });

  const labels = data
    .map(
      d =>
        `<span class="text-[10px] text-slate-400 font-medium flex-1 text-center">${d.label}</span>`
    )
    .join('');

  return `
    <div class="w-full" style="height:${height}px">
      <svg viewBox="0 0 100 ${height / 2}" preserveAspectRatio="none" class="w-full h-full">
        ${bars}
      </svg>
      <div class="flex justify-between mt-1">
        ${labels}
      </div>
    </div>
  `;
}

  function LineChart(data, height = 200, color = '#2563eb') {
    const max = Math.max(...data.map(d => d.value), 1);
    const min = Math.min(...data.map(d => d.value), 0);
    const range = max - min || 1;
    const w = 100, h = height / 2;
    const points = data.map((d, i) => {
      const x = (i / (data.length - 1 || 1)) * w;
      const y = h - ((d.value - min) / range) * (h - 10) - 5;
      return { x, y, ...d };
    });
    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
    const areaPath = `${path} L ${w} ${h} L 0 ${h} Z`;
    const dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="1.5" fill="white" stroke="${color}" stroke-width="1"/>`).join('');
    const labels = data.map(d => `<span class="text-[10px] text-slate-400 font-medium">${d.label}</span>`).join('');
    return `<div class="w-full" style="height:${height}px"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="w-full h-full"><defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${areaPath}" fill="url(#lineGrad)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><div class="flex justify-between mt-1">${labels}</div></div>`;
  }

  function DonutChart(data, size = 160) {
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    const radius = 40;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;
    const circles = data.map(d => {
      const len = (d.value / total) * circumference;
      const circle = `<circle cx="50" cy="50" r="${radius}" fill="none" stroke="${d.color}" stroke-width="12" stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}" stroke-linecap="round"/>`;
      offset += len;
      return circle;
    }).join('');
    const legend = data.map(d => `<div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${d.color}"></span><span class="text-xs font-medium text-slate-600 dark:text-slate-300">${d.label}</span><span class="text-xs font-bold text-slate-800 dark:text-slate-100 ml-auto">${d.value}</span></div>`).join('');
    return `<div class="flex items-center gap-5"><svg width="${size}" height="${size}" viewBox="0 0 100 100" class="-rotate-70">${circles}<text x="50" y="50" text-anchor="middle" dominant-baseline="middle" fill="currentColor" font-size="14" font-weight="700">${total}</text></svg><div class="flex flex-col gap-2">${legend}</div></div>`;
  }

  function ProgressRing(value, max, size = 120, color = '#2563eb', label = '') {
    const pct = Math.min(value / max, 1);
    const radius = 42;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference * (1 - pct);
    return `<div class="relative inline-flex items-center justify-center" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 100 100" class="-rotate-90"><circle cx="50" cy="50" r="${radius}" fill="none" stroke="currentColor" stroke-width="8" class="text-slate-100 dark:text-slate-800"/><circle cx="50" cy="50" r="${radius}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" stroke-linecap="round" class="transition-all duration-700"/></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-2xl font-bold text-slate-900 dark:text-white">${value}</span>${label ? `<span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">${label}</span>` : ''}</div></div>`;
  }

${f.department === 'Other' ? `

  let histActiveTriggerEl = null;
  let histPanelEl = null;

  function renderHistRowsHTML(rows) {
    return rows.map(r => `<tr class="border-b border-slate-100 dark:border-slate-800/50">
        <td class="px-2 py-2"><input class="input py-2" value="${r.label}" onchange="state.createForm.histologySamples.find(x=>x.id==='${r.id}').label=this.value;render()" placeholder="S-${r.id}"></td>
        <td class="px-2 py-2 relative">
          <button type="button" data-hist-trigger="${r.id}" onclick="toggleHistCombo('${r.id}', this)" class="input py-2 flex items-center justify-between gap-2 text-left ${r.type ? 'text-slate-900 dark:text-slate-100' : 'text-slate-400'}">
            <span class="truncate">${r.type || 'Select specimen type'}</span>
            ${i('chevronDown', 14, 'shrink-0 text-slate-400')}
          </button>
        </td>
        <td class="px-2 py-2 text-center"><input type="number" min="1" class="input py-2 w-16 text-center" value="${r.count}" onchange="state.createForm.histologySamples.find(x=>x.id==='${r.id}').count=Math.max(1,parseInt(this.value)||1);render()"></td>
        <td class="px-2 py-2"><select class="input py-2" onchange="state.createForm.histologySamples.find(x=>x.id==='${r.id}').priority=this.value;render()">${['Routine', 'Urgent'].map(p => `<option value="${p}" ${r.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select></td>
        <td class="px-2 py-2"><input class="input py-2" value="${r.remarks}" onchange="state.createForm.histologySamples.find(x=>x.id==='${r.id}').remarks=this.value;render()" placeholder="Optional remarks"></td>
        <td class="px-2 py-2 text-center">${rows.length > 1 ? `<button onclick="state.createForm.histologySamples=state.createForm.histologySamples.filter(x=>x.id!=='${r.id}');render()" class="p-1.5 rounded-lg text-danger-500 hover:bg-danger-50 dark:hover:bg-danger-500/10 transition-colors">${i('trash', 16)}</button>` : ''}</td>
      </tr>${r.type === 'Other' ? `
<tr class="border-b border-slate-100 dark:border-slate-800/50">
  <td colspan="5" class="px-2 pb-2 pt-0">
    <div class="w-1/2">
      <label class="label">
        ${i('fileText', 11)} Specify Specimen Type
        <span class="text-danger-500">*</span>
      </label>
      <input
        class="input py-2 mt-2 w-full"
        value="${r.otherType || ''}"
        onchange="state.createForm.histologySamples.find(x=>x.id==='${r.id}').otherType=this.value"
        placeholder="Enter specimen type"
      >
    </div>
  </td>
</tr>` : ''}`).join('');
  }

  function ensureHistPanel() {
    if (histPanelEl && document.body.contains(histPanelEl)) return histPanelEl;
    const panel = document.createElement('div');
    panel.id = 'histFloatingPanel';
    panel.className = 'hidden fixed z-50 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl shadow-elevated overflow-hidden';
    panel.style.position = 'fixed';
    panel.innerHTML = `
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-slate-100 dark:border-slate-800">
        ${i('search', 15, 'text-slate-400 shrink-0')}
        <input id="histFloatingSearch" class="flex-1 text-sm outline-none bg-transparent placeholder-slate-400 min-w-0 text-slate-800 dark:text-slate-100" placeholder="Search specimen type..."
          oninput="filterHistCombo(this.value)"
          onkeydown="if(event.key==='Escape'){closeAllHistCombos();}">
        <button type="button" id="histFloatingClear" onmousedown="event.preventDefault();clearHistCombo()" class="hidden w-4 h-4 rounded-full bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 flex items-center justify-center shrink-0">${i('x', 9, 'text-white')}</button>
      </div>
      <div id="histFloatingList" class="max-h-64 overflow-y-auto"></div>`;
    document.body.appendChild(panel);
    histPanelEl = panel;
    return panel;
  }

  function positionHistPanel(btnEl) {
    if (!btnEl || !histPanelEl) return;
    const rect = btnEl.getBoundingClientRect();
    const panel = histPanelEl;
    panel.style.width = Math.max(rect.width, 288) + 'px';
    const panelHeight = panel.offsetHeight || 320;
    let top = rect.bottom + 6;
    if (top + panelHeight > window.innerHeight - 8) top = Math.max(8, rect.top - panelHeight - 6);
    let left = rect.left;
    const panelWidth = panel.offsetWidth || 288;
    if (left + panelWidth > window.innerWidth - 8) left = window.innerWidth - panelWidth - 8;
    if (left < 8) left = 8;
    panel.style.top = top + 'px';
    panel.style.left = left + 'px';
  }

  function toggleHistCombo(id, btnEl) {
    const panel = ensureHistPanel();
    const isOpen = openHistComboId === id && !panel.classList.contains('hidden');
    closeAllHistCombos();
    if (isOpen) return;
    const row = state.createForm.histologySamples.find(x => x.id === id);
    if (!row) return;
    openHistComboId = id;
    histActiveTriggerEl = btnEl;
    row.query = ''; // always start browsing from the full list
    panel.querySelector('#histFloatingSearch').value = '';
    panel.querySelector('#histFloatingClear').classList.add('hidden');
    panel.querySelector('#histFloatingList').innerHTML = buildHistListHTML(id);
    panel.classList.remove('hidden');
    positionHistPanel(btnEl);
    panel.querySelector('#histFloatingSearch').focus();
  }

  function closeAllHistCombos() {
    if (histPanelEl) histPanelEl.classList.add('hidden');
    openHistComboId = null;
    histActiveTriggerEl = null;
  }

  function filterHistCombo(val) {
    if (!openHistComboId) return;
    const row = state.createForm.histologySamples.find(x => x.id === openHistComboId);
    if (!row) return;
    row.query = val;
    histPanelEl.querySelector('#histFloatingClear').classList.toggle('hidden', !val);
    histPanelEl.querySelector('#histFloatingList').innerHTML = buildHistListHTML(openHistComboId);
  }

  function clearHistCombo() {
    if (!openHistComboId) return;
    const row = state.createForm.histologySamples.find(x => x.id === openHistComboId);
    if (!row) return;
    row.query = '';
    const inp = histPanelEl.querySelector('#histFloatingSearch');
    inp.value = '';
    inp.focus();
    histPanelEl.querySelector('#histFloatingClear').classList.add('hidden');
    histPanelEl.querySelector('#histFloatingList').innerHTML = buildHistListHTML(openHistComboId);
  }

  function histOptionRowHTML(name, selectedVal) {
    const isSelected = selectedVal === name;
    return `<div onmousedown="pickHistCombo('${name.replace(/'/g, "\\'")}')" class="flex items-center justify-between gap-3 px-3 py-2 text-sm cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 ${isSelected ? 'text-slate-900 dark:text-white font-medium' : 'text-slate-700 dark:text-slate-300'}">
      <span class="truncate">${name}</span>
      ${isSelected ? i('check', 15, 'text-slate-900 dark:text-white shrink-0') : ''}
    </div>`;
  }

  function histNoResultsHTML() {
    return `<div class="flex flex-col items-center justify-center text-center px-6 py-10">
      <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mb-3">${i('search', 18, 'text-slate-400')}</div>
      <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">No results</p>
      <p class="text-xs text-slate-400 mt-1">We couldn't find any specimen type with that name.</p>
    </div>`;
  }

  function buildHistListHTML(id) {
    const row = state.createForm.histologySamples.find(x => x.id === id);
    if (!row) return '';
    const query = (row.query || '').trim().toLowerCase();

    if (!query) {
      return HISTOLOGY_FLAT_LIST
        .slice()
        .sort((a, b) => a.localeCompare(b))
        .map(t => histOptionRowHTML(t, row.type))
        .join('') + histOptionRowHTML('Other', row.type);
    }

    const matches = HISTOLOGY_FLAT_LIST.filter(t => t.toLowerCase().includes(query)).sort((a, b) => a.localeCompare(b));
    if ('other'.includes(query)) matches.push('Other');
    if (!matches.length) return histNoResultsHTML();

    return `<div class="px-3 pt-3 pb-1 text-[11px] font-semibold text-slate-400 uppercase tracking-wide">${matches.length} Result${matches.length > 1 ? 's' : ''}</div>
      ${matches.map(t => histOptionRowHTML(t, row.type)).join('')}`;
  }

  function pickHistCombo(value) {
    if (!openHistComboId) return;
    const row = state.createForm.histologySamples.find(x => x.id === openHistComboId);
    if (!row) return;
    row.type = value;
    if (value !== 'Other') row.otherType = '';
    row.query = '';
    closeAllHistCombos();
    render();
  }

  function handleHistReposition() {
    if (!openHistComboId) return;
    if (!histActiveTriggerEl || !document.body.contains(histActiveTriggerEl)) { closeAllHistCombos(); return; }
    positionHistPanel(histActiveTriggerEl);
  }
  window.addEventListener('scroll', handleHistReposition, true);
  window.addEventListener('resize', handleHistReposition);

  document.addEventListener('click', (e) => {
    if (!openHistComboId) return;
    if (histPanelEl && histPanelEl.contains(e.target)) return;
    if (e.target.closest && e.target.closest('[data-hist-trigger]')) return;
    closeAllHistCombos();
  });

  
  function renderHistBRowsHTML(rows) {
    return rows.map(r => `<tr class="border-b border-slate-100 dark:border-slate-800/50">
        <td class="px-2 py-2"><input class="input py-2" value="${r.label}" onchange="state.createForm.histologySamplesB.find(x=>x.id==='${r.id}').label=this.value;render()" placeholder="S-${r.id}"></td>
        <td class="px-2 py-2">
          <select class="input py-2" onchange="setHistCategoryB('${r.id}', this.value)">
            <option value="">Select category</option>
            ${Object.keys(HISTOLOGY_SPECIMEN_DATA).sort((a, b) => a.localeCompare(b)).map(cat => `<option value="${cat}" ${r.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
            
          </select>
        </td>
        <td class="px-2 py-2">
          <select class="input py-2" ${!r.category ? 'disabled' : ''} onchange="state.createForm.histologySamplesB.find(x=>x.id==='${r.id}').type=this.value;render()">
            <option value="">${r.category ? 'Select type' : 'Choose category first'}</option>
            ${r.category && r.category !== 'Other' && HISTOLOGY_SPECIMEN_DATA[r.category] ? [...HISTOLOGY_SPECIMEN_DATA[r.category]].sort((a, b) => a.localeCompare(b)).map(t => `<option value="${t}" ${r.type === t ? 'selected' : ''}>${t}</option>`).join('') : ''}
            ${r.category ? `<option value="Other" ${r.type === 'Other' ? 'selected' : ''}>Other</option>` : ''}
          </select>
        </td>
        <td class="px-2 py-2 text-center"><input type="number" min="1" class="input py-2 w-16 text-center" value="${r.count}" onchange="state.createForm.histologySamplesB.find(x=>x.id==='${r.id}').count=Math.max(1,parseInt(this.value)||1);render()"></td>

  function submitCreateForm(status) {
    const f = state.createForm;
    if (!f.mrn || !f.patientName || !f.area || !f.destinationLab) { showToast('warning', 'Please fill required fields'); return; }
    const initials = f.patientName.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 3) + '.';
    const resolvedDepartment = f.department === 'Other' ? (f.otherDepartment || 'Other') : f.department;
    const resolvedConsultant = f.consultant === 'Other' ? (f.otherConsultant || 'Other') : f.consultant;
    const resolvedDestinationLab = f.destinationLab === 'Other' ? (f.otherDestinationLab || 'Other') : f.destinationLab;
    const resolvedAuthorisedBy = {
      staff1: { name: f.authorisedBy.staff1.name || '', role: f.authorisedBy.staff1.role === 'Other' ? (f.authorisedBy.staff1.otherRole || 'Other') : f.authorisedBy.staff1.role, grade: f.authorisedBy.staff1.grade === 'Other' ? (f.authorisedBy.staff1.otherGrade || 'Other') : f.authorisedBy.staff1.grade },
      staff2: { name: f.authorisedBy.staff2.name || '', role: f.authorisedBy.staff2.role === 'Other' ? (f.authorisedBy.staff2.otherRole || 'Other') : f.authorisedBy.staff2.role, grade: f.authorisedBy.staff2.grade === 'Other' ? (f.authorisedBy.staff2.otherGrade || 'Other') : f.authorisedBy.staff2.grade },
      date: f.authorisedBy.date,
    };
    // The live form collects specimens in histologySamplesB — map those onto
    // `samples` so they show up in details, counts, QR labels and every list.
    const PRIORITY_RANK = { Routine: 0, Urgent: 1 };
    const builtSamples = (f.histologySamplesB || [])
      .map((r, idx) => {
        const category = r.category === 'Other' ? (r.otherCategory || 'Other') : (r.category || '');
        const type = r.type === 'Other' ? (r.otherType || 'Other') : (r.type || '');
        if (!category && !type && !r.label && !r.remarks) return null; // skip untouched rows
        return {
          id: r.id || `s-${idx + 1}`,
          label: (r.label || '').trim() || `S-${idx + 1}`,
          specimenType: category || 'Other',
          specimenDetail: type,
          count: Math.max(1, parseInt(r.count) || 1),
          cytology: false,
          remarks: r.remarks || '',
          priority: r.priority || 'Routine',
        };
      })
      .filter(Boolean);

    const resolvedSamples = builtSamples.length ? builtSamples : (f.samples || []).filter(x => x.label || x.remarks);
    if (resolvedSamples.length === 0) { showToast('warning', 'Please add at least one specimen'); return; }

    // Transfer priority follows the most urgent specimen on the form
    const topPriority = resolvedSamples.reduce((acc, x) =>
      (PRIORITY_RANK[x.priority] || 0) > (PRIORITY_RANK[acc] || 0) ? x.priority : acc, f.priority || 'Routine');

    const payload = {
      ...f,
      caseId: f.caseId || `CUMH-${(f.area === 'Theatre 1' || f.area === 'Theatre 2') ? 'OR' : '4S'}-${Math.floor(1000 + Math.random() * 9000)}`,
      patientName: f.patientName.trim(),
      patientInitials: initials,
      samples: resolvedSamples,
      priority: topPriority,
      location: f.area,
      department: resolvedDepartment || f.area,
      consultant: resolvedConsultant,
      destinationLab: resolvedDestinationLab,
      authorisedBy: resolvedAuthorisedBy,
      status,
    };
    const created = createTransfer(payload);
    showToast('success', status === 'draft' ? 'Draft saved' : 'Transfer created');
    state.createForm = blankCreateForm();
    state.createDraftSaved = false;
    state.createDraftSavedAt = null;
    setPage('dashboard');
    openQrModal(created.id);
  }

  // ---- Excel (CSV) export used by the Porter Assigned / Porter Collected pages ----
  // Finds the timestamp of a given stage in a transfer's timeline (last match wins). Returns null if that stage hasn't happened yet.
  function timelineStamp(t, statuses) {
    const list = Array.isArray(statuses) ? statuses : [statuses];
    const evs = t.timeline || [];
    for (let k = evs.length - 1; k >= 0; k--) {
      if (list.includes(evs[k].status)) return evs[k].timestamp;
    }
    return null;
  }

  function exportTransfersToExcel(list, filenamePrefix) {
    if (!list || list.length === 0) { showToast('warning', 'Nothing to export'); return; }
    const headers = ['Trx ID', 'Case ID', 'MRN', 'Patient Name', 'From', 'To Lab', 'Priority', 'Status', 'Porter', 'Requested Date & Time', 'Assigned Date & Time', 'Collected Date & Time', 'Delivered/Received Date & Time', 'Cancel Reason'];
    const escapeCsv = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const dt = (stamp) => stamp ? formatDateTime(stamp) : '';
    const rows = list.map(t => {
      const requested = timelineStamp(t, 'created') || t.createdAt;
      const assigned = timelineStamp(t, 'assigned');
      const collected = timelineStamp(t, ['collected', 'in_transit']);
      const delivered = timelineStamp(t, ['received', 'completed', 'rejected']);
      return [
        t.id, t.caseId || '', t.mrn, displayName(t), t.location, t.destinationLab, t.priority,
        STATUS_META[t.status] ? STATUS_META[t.status].label : t.status,
        t.collectedBy || '',
        dt(requested), dt(assigned), dt(collected), dt(delivered),
        t.status === 'cancelled' ? (t.cancelReason || '') : '',
      ].map(escapeCsv).join(',');
    });
    const csv = [headers.map(escapeCsv).join(','), ...rows].join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filenamePrefix}-${todayDate()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('success', 'Exported to Excel (CSV)');
  }

            ${hasFilters ? `<button onclick="state.historyQuery='';state.historyLocationFilter='';state.historyPriorityFilter='';state.portersHistoryPage=1;render()" class="btn-ghost text-xs px-2.5 py-2 whitespace-nowrap">${i('x', 13)} Clear</button>` : ''}

  function renderTheatrePending() {
    const pending = state.transfers.filter(t => t.status === 'pending').sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    const view = state.pendingView || 'cards';
    const toggle = `<div class="flex items-center gap-1 p-1 rounded-lg bg-slate-100 dark:bg-slate-800">
        <button onclick="state.pendingView='cards';render()" class="p-1.5 rounded-md ${view === 'cards' ? 'bg-white dark:bg-slate-900 shadow-sm' : ''}">${i('grid', 16, view === 'cards' ? 'text-brand-600' : 'text-slate-400')}</button>
        <button onclick="state.pendingView='table';render()" class="p-1.5 rounded-md ${view === 'table' ? 'bg-white dark:bg-slate-900 shadow-sm' : ''}">${i('list', 16, view === 'table' ? 'text-brand-600' : 'text-slate-400')}</button>
      </div>`;
    const empty = `<div class="card p-12 text-center"><div class="w-16 h-16 rounded-full bg-green-50 dark:bg-green-500/10 flex items-center justify-center mx-auto mb-4">${i('checkCircle', 28, 'text-green-500')}</div><h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">Nothing awaiting collection</h3><p class="text-sm text-slate-500 mt-1">Every sample you've readied has been picked up by a porter.</p></div>`;
    let body;
    if (pending.length === 0) {
      body = empty;
    } else if (view === 'table') {
      const rows = pending.map(t => `<tr class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors"><td class="px-5 py-3 font-mono text-xs font-semibold text-slate-800 dark:text-slate-200">${t.caseId || t.id}</td><td class="px-3 py-3 font-mono text-xs text-slate-500 dark:text-slate-400">${t.mrn}</td><td class="px-3 py-3 text-slate-600 dark:text-slate-400 text-xs">${t.location}</td><td class="px-3 py-3 text-slate-600 dark:text-slate-400 text-xs hidden md:table-cell">${t.destinationLab}</td><td class="px-3 py-3">${PriorityBadge(t.priority)}</td><td class="px-3 py-3 text-xs text-slate-500 dark:text-slate-400 hidden sm:table-cell">${timeAgo(t.createdAt)}</td><td class="px-5 py-3 text-right"><div class="flex items-center gap-2 justify-end"><button onclick="openDrawer('${t.id}')" class="btn-secondary text-xs px-3 py-1.5">${i('eye', 14)} Details</button><button onclick="openQrModal('${t.id}')" title="View / Print QR Label" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg text-brand-600 bg-brand-50 border border-brand-200 hover:bg-brand-100 hover:border-brand-300 dark:text-brand-400 dark:bg-brand-500/10 dark:border-brand-500/30 dark:hover:bg-brand-500/20 transition-colors">${i('qr', 15)} QR</button><button onclick="openCancelModal('${t.id}')" title="Cancel Request" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 hover:border-red-300 dark:text-red-400 dark:bg-red-500/10 dark:border-red-500/30 dark:hover:bg-red-500/20 transition-colors">${i('cancel', 15)} Cancel</button></div></td></tr>`).join('');
      body = `<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30"><th class="px-5 py-3 font-semibold">Case</th><th class="px-3 py-3 font-semibold">MRN</th><th class="px-3 py-3 font-semibold">From</th><th class="px-3 py-3 font-semibold hidden md:table-cell">To Lab</th><th class="px-3 py-3 font-semibold">Priority</th><th class="px-3 py-3 font-semibold hidden sm:table-cell">Waiting</th><th class="px-5 py-3 font-semibold text-right">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    } else {
      body = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${pending.map(t => `<div class="card card-hover p-5"><div class="flex items-center justify-between mb-3"><span class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.caseId || t.id}</span>${PriorityBadge(t.priority)}</div><div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-3">${i('mapPin', 13)} ${t.location} ${i('arrowRight', 13)} ${t.destinationLab}</div><div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-4"><span>${displayName(t)} &middot; ${t.samples.reduce((s, x) => s + x.count, 0)} samples</span><span>${timeAgo(t.createdAt)}</span></div><div class="flex items-center gap-2"><span class="inline-flex items-center gap-1 text-xs font-semibold text-amber-600 dark:text-amber-400">${i('clock', 13)} Awaiting porter</span><div class="ml-auto flex gap-2"><button onclick="openDrawer('${t.id}')" class="btn-secondary text-xs px-3 py-1.5">${i('eye', 14)} Details</button><button onclick="openQrModal('${t.id}')" title="View / Print QR Label" aria-label="View or print QR label" class="p-2 rounded-lg text-brand-600 bg-brand-50 border border-brand-200 hover:bg-brand-100 hover:border-brand-300 dark:text-brand-400 dark:bg-brand-500/10 dark:border-brand-500/30 dark:hover:bg-brand-500/20 transition-colors">${i('qr', 17)}</button><button onclick="openCancelModal('${t.id}')" title="Cancel Request" aria-label="Cancel Request" class="p-2 rounded-lg text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 hover:border-red-300 dark:text-red-400 dark:bg-red-500/10 dark:border-red-500/30 dark:hover:bg-red-500/20 transition-colors">${i('cancel', 17)}</button></div></div></div>`).join('')}</div>`;
    }
    return `<div class="space-y-5 max-w-[1600px] mx-auto"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Pending Collection</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Samples ready and waiting for a porter to collect (${pending.length})</p></div>${toggle}</div>${body}</div>`;
  }

  function renderTheatreTransit() {
    const inTransit = state.transfers.filter(isAssigned).sort((a, b) => lastActivityAt(b) - lastActivityAt(a));
    const selected = inTransit.find(t => t.id === state.transitSelectedId) || inTransit[0] || null;
    if (inTransit.length === 0) {
      return `<div class="space-y-5 max-w-[1600px] mx-auto"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Collected</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Samples assigned to a porter and on their way to the lab</p></div><div class="card p-12 text-center"><div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-4">${i('truck', 28, 'text-slate-400')}</div><h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">Nothing collected</h3><p class="text-sm text-slate-500 mt-1">No samples are currently assigned to a porter.</p></div></div>`;
    }
    const listItems = inTransit.map(t => `<button onclick="state.transitSelectedId='${t.id}';render()" class="w-full card p-4 text-left transition-all ${selected?.id === t.id ? 'ring-2 ring-brand-500 shadow-card-hover' : 'card-hover'}"><div class="flex items-center justify-between mb-2"><span class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.caseId || t.id}</span>${StatusBadge(t.status)}</div><p class="text-xs text-slate-500 dark:text-slate-400">${displayName(t)} &middot; ${t.location} &rarr; ${t.destinationLab}</p><div class="flex items-center justify-between mt-2">${PriorityBadge(t.priority)}<span class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 dark:text-slate-400">${i('truck', 12)} ${t.collectedBy || 'Unassigned'}</span></div></button>`).join('');
    const detail = selected ? (() => {
      const collectedEv = selected.timeline.find(e => e.status === 'collected');
      const transitEv = selected.timeline.find(e => e.status === 'in_transit');
      const sampleList = selected.samples.map(s => `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 flex items-center justify-between"><div><span class="font-mono text-sm font-bold text-slate-800 dark:text-slate-200">${s.label}</span><span class="text-xs text-slate-500 dark:text-slate-400 ml-2">${s.specimenType}</span></div><span class="text-xs font-semibold text-slate-600 dark:text-slate-400">&times;${s.count}</span></div>`).join('');
      return `<div class="card p-6"><div class="flex items-center justify-between mb-5"><div><h3 class="text-lg font-bold text-slate-900 dark:text-white">${selected.caseId || selected.id}</h3><p class="text-xs font-mono text-slate-500 mt-0.5">${selected.id}</p></div>${StatusBadge(selected.status)}</div><div class="grid grid-cols-2 gap-3 mb-5"><div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">From</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-medium">${selected.location}</p></div><div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">To Lab</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-medium">${selected.destinationLab}</p></div><div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Porter</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-medium">${selected.collectedBy || '—'}</p></div><div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Collected</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-medium">${collectedEv ? formatDateTime(collectedEv.timestamp) : '—'}</p><p class="text-[11px] text-slate-400 mt-0.5">${collectedEv ? timeAgo(collectedEv.timestamp) : ''}</p></div></div><div class="mb-5 p-3 rounded-xl bg-blue-50 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-500/20 flex items-center gap-2 text-sm text-blue-700 dark:text-blue-400 font-medium">${i('truck', 16)} Assigned to ${selected.collectedBy || 'a porter'}${collectedEv ? ' · ' + timeAgo(collectedEv.timestamp) : ''} — on the way to ${selected.destinationLab}</div><div class="mb-2"><h4 class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-2">Samples</h4><div class="space-y-2">${sampleList}</div></div></div>`;
    })() : '';
    return `<div class="space-y-5 max-w-[1600px] mx-auto"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Collected</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Samples assigned to a porter and on their way to the lab (${inTransit.length})</p></div><div class="grid grid-cols-1 lg:grid-cols-5 gap-4"><div class="lg:col-span-2 space-y-3">${listItems}</div><div class="lg:col-span-3">${detail}</div></div></div>`;
  }

  function renderHistory() {
    if (state.persona === 'porters') return renderPortersHistory();
    // Lab and Theatre records show received/completed/rejected samples plus cancelled requests — newest activity first.
    const isHistoryStatus = (t) => isReceivedStatus(t) || t.status === 'cancelled';
    const locationOptions = [...new Set(state.transfers.filter(isHistoryStatus).map(t => t.location).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const priorityOptions = ['Routine', 'Urgent'].filter(pr => state.transfers.some(t => isHistoryStatus(t) && t.priority === pr));
    const filtered = state.transfers
      .filter(isHistoryStatus)
      .filter(t => {
        const q = (state.historyQuery || '').toLowerCase();
        return !q || t.mrn.toLowerCase().includes(q) || t.patientInitials.toLowerCase().includes(q) || displayName(t).toLowerCase().includes(q) || t.id.toLowerCase().includes(q);
      })
      .filter(t => !state.historyLocationFilter || t.location === state.historyLocationFilter)
      .filter(t => !state.historyPriorityFilter || t.priority === state.historyPriorityFilter)
      .sort((a, b) => lastActivityAt(b) - lastActivityAt(a));

    const page = clampPage(state.historyPage, filtered.length, HISTORY_PAGE_SIZE);
    state.historyPage = page;
    const visible = pageSlice(filtered, page, HISTORY_PAGE_SIZE);
    const hasFilters = state.historyLocationFilter || state.historyPriorityFilter || (state.historyQuery || '').trim();

    const items = visible.map(t => `<div class="card card-hover p-5"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center">${i('package', 20, 'text-brand-600 dark:text-brand-400')}</div><div><p class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.mrn}</p><p class="text-xs text-slate-500 dark:text-slate-400">${displayName(t)}</p></div></div><div class="flex items-center gap-2 flex-wrap">${PriorityBadge(t.priority)}${StatusBadge(t.status)}<span class="text-xs text-slate-400">${timeAgo(t.createdAt)}</span>${state.persona === 'theatre' ? `<button onclick="event.stopPropagation();openQrModal('${t.id}')" title="View / Print QR Label" aria-label="View or print QR label" class="p-2 rounded-lg text-brand-600 bg-brand-50 border border-brand-200 hover:bg-brand-100 hover:border-brand-300 dark:text-brand-400 dark:bg-brand-500/10 dark:border-brand-500/30 dark:hover:bg-brand-500/20 transition-colors">${i('qr', 17)}</button>` : ''}<button onclick="openDrawer('${t.id}')" class="btn-secondary text-xs px-3 py-1.5">${i('eye', 14)} Details</button></div></div><div class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400 mb-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">${i('mapPin', 15, 'text-brand-500')}<span class="font-medium">${t.location}</span>${i('arrowRight', 15, 'text-slate-400')}<span class="font-medium">${t.destinationLab}</span><span class="ml-auto text-xs text-slate-400">${t.status === 'cancelled' ? 'Cancelled' : 'Delivery'}: ${t.status === 'cancelled' ? timeAgo(lastActivityAt(t)) : calcDeliveryTime(t)}</span></div>${t.status === 'cancelled' ? `<div class="flex items-start gap-2 text-xs text-red-700 dark:text-red-300 bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 rounded-xl px-3 py-2">${i('cancel', 14, 'mt-0.5 shrink-0')}<span><span class="font-semibold">Cancellation reason:</span> ${t.cancelReason || 'Not specified'}</span></div>` : ''}</div>`).join('');

    return `<div class="space-y-5 max-w-[1600px] mx-auto">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Transfer History</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Samples received, completed, rejected, or cancelled</p></div>
          <button onclick="exportTransfersToExcel(state.transfers.filter(t => isReceivedStatus(t) || t.status === 'cancelled'), 'lab-transfer-history')" class="btn-secondary text-sm">${i('fileText', 16)} Export to Excel</button>
        </div>
        <div class="card p-4">
          <div class="flex flex-col sm:flex-row sm:items-center gap-3">
            <div class="relative flex-1">${i('search', 17, 'absolute left-3 top-1/2 -translate-y-1/2 text-slate-400')}<input class="input pl-9" value="${state.historyQuery}" onchange="state.historyQuery=this.value;state.historyPage=1;render()" placeholder="Search by MRN, patient name, Trx ID..."></div>
            <select class="input py-2 text-sm w-full sm:w-52" onchange="state.historyLocationFilter=this.value;state.historyPage=1;render()"><option value="">Pickup Locations</option>${locationOptions.map(o => `<option value="${o}" ${state.historyLocationFilter === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
            <select class="input py-2 text-sm w-full sm:w-40" onchange="state.historyPriorityFilter=this.value;state.historyPage=1;render()"><option value="">Priorities</option>${priorityOptions.map(o => `<option value="${o}" ${state.historyPriorityFilter === o ? 'selected' : ''}>${o}</option>`).join('')}</select>
            ${hasFilters ? `<button onclick="state.historyQuery='';state.historyLocationFilter='';state.historyPriorityFilter='';state.historyPage=1;render()" class="btn-ghost text-xs px-2.5 py-2 whitespace-nowrap">${i('x', 13)} Clear</button>` : ''}

      </div>`;
  }

  function renderReports() {
    const completed = state.transfers.filter(t => t.status === 'completed');
    const pending = state.transfers.filter(t => t.status === 'pending' || t.status === 'draft');
    const rejected = state.transfers.filter(t => t.status === 'rejected');
    const inTransit = state.transfers.filter(isAssigned);
    const perDay = [{ label: 'Mon', value: 18 }, { label: 'Tue', value: 24 }, { label: 'Wed', value: 21 }, { label: 'Thu', value: 28 }, { label: 'Fri', value: 32 }, { label: 'Sat', value: 14 }, { label: 'Sun', value: 9 }];
    const statusData = [ { label: 'Pending', value: pending.length, color: '#f59e0b' }, { label: 'Assigned', value: inTransit.length, color: '#3b82f6' }];
    const byDept = DEPARTMENTS.slice(0, 6).map((d, i) => ({ label: d.replace('Theatre ', 'Th').replace('Ward ', 'W'), value: [4, 3, 2, 2, 1, 1][i] || 0 }));
    const byLab = LABS.slice(0, 6).map((l, i) => ({ label: l.slice(0, 4), value: [3, 2, 2, 1, 1, 1][i] || 0 }));
    const deliveryTimes = LABS.slice(0, 6).map((lab, i) => { const times = [38, 45, 52, 41, 35, 48]; const pct = (times[i] / 60) * 100; return `<div><div class="flex items-center justify-between mb-1"><span class="text-sm font-medium text-slate-700 dark:text-slate-300">${lab}</span><span class="text-xs font-semibold text-slate-500">${times[i]} min</span></div><div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div class="h-full rounded-full transition-all duration-700 ${pct < 50 ? 'bg-green-500' : pct < 80 ? 'bg-amber-500' : 'bg-red-500'}" style="width:${pct}%"></div></div></div>`; }).join('');
    return `<div class="space-y-5 max-w-[1600px] mx-auto"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><h2 class="text-2xl font-bold text-slate-900 dark:text-white">Reports &amp; Analytics</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Transfer statistics and performance metrics</p></div><button onclick="showToast('success','Report exported successfully')" class="btn-secondary">${i('download', 17)} Export Report</button></div><div class="grid grid-cols-2 lg:grid-cols-3 gap-4"><div class="card p-5"><div class="flex items-center justify-between mb-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400">${i('chart', 20)}</div><span class="text-xs font-semibold text-green-600">+12%</span></div><p class="text-2xl font-bold text-slate-900 dark:text-white">${state.transfers.length}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Total Transfers</p></div><div class="card p-5"><div class="flex items-center justify-between mb-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400">${i('clock', 20)}</div><span class="text-xs font-semibold text-green-600">-8%</span></div><p class="text-2xl font-bold text-slate-900 dark:text-white">42 min</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Avg Transfer Time</p></div><div class="card p-5"><div class="flex items-center justify-between mb-3"><div class="w-10 h-10 rounded-xl flex items-center justify-center bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400">${i('clock3', 20)}</div><span class="text-xs font-semibold text-green-600">+2</span></div><p class="text-2xl font-bold text-slate-900 dark:text-white">${pending.length}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Pending</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div class="card p-5"><div class="flex items-center justify-between mb-4"><div><h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers Per Day</h3><p class="text-xs text-slate-500 dark:text-slate-400">Last 7 days</p></div>${i('trendingUp', 18, 'text-green-500')}</div>${LineChart(perDay, 200, '#2563eb')}</div><div class="card p-5"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-1">Pending vs Assigned</h3><p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Status distribution</p><div class="flex justify-center py-2">${DonutChart(statusData, 160)}</div></div><div class="card p-5"><div class="flex items-center gap-2 mb-4">${i('building', 18, 'text-brand-500')}<h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers by Location</h3></div>${BarChart(byDept, '#6366f1', 200)}</div><div class="card p-5"><div class="flex items-center gap-2 mb-4">${i('flask', 18, 'text-brand-500')}<h3 class="text-base font-bold text-slate-900 dark:text-white">Transfers to Lab</h3></div>${BarChart(byLab, '#16a34a', 200)}</div></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="card p-5 text-center"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-3">Completion Progress</h3><div class="flex justify-center py-3">${ProgressRing(completed.length, state.transfers.length, 140, '#16a34a', 'Completed')}</div><p class="text-sm text-slate-500 dark:text-slate-400 mt-2">${completed.length} of ${state.transfers.length} transfers completed</p></div><div class="card p-5 lg:col-span-2"><h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">Delivery Time by Lab</h3><div class="space-y-3">${deliveryTimes}</div></div></div></div>`;
  }

  function renderSearchResults() {

  function renderQrModal() {

  function renderDrawer() {
    if (!state.drawerTransferId) return '';
    const t = getTransfer(state.drawerTransferId);
    if (!t) return '';
    const timelineItems = t.timeline.map((ev, i) => `<div class="relative pb-4 last:pb-0"><div class="absolute -left-4.5 w-4 h-4 rounded-full border-2 border-white dark:border-slate-900 ${i === t.timeline.length - 1 ? 'bg-brand-500' : 'bg-slate-300 dark:bg-slate-600'}" style="left:-1.125rem"></div><div class="ml-2"><p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${ev.label}</p><p class="text-xs text-slate-500 dark:text-slate-400">${ev.user} · ${ev.department}</p><p class="text-[11px] text-slate-400 mt-0.5">${formatDateTime(ev.timestamp)} · ${timeAgo(ev.timestamp)}</p>${ev.note ? `<p class="text-xs text-slate-600 dark:text-slate-400 mt-1 italic">"${ev.note}"</p>` : ''}</div></div>`).join('');
    const sampleItems = t.samples.map(s => `<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800"><div class="flex items-center justify-between mb-1"><span class="font-mono text-sm font-bold text-slate-800 dark:text-slate-200">${s.label}</span><div class="flex items-center gap-2"><span class="badge bg-brand-100 text-brand-700 dark:bg-brand-500/20 dark:text-brand-300">${s.specimenType}</span><span class="text-xs font-semibold text-slate-600 dark:text-slate-400">×${s.count}</span>${s.cytology ? '<span class="badge bg-purple-100 text-purple-700 dark:bg-purple-500/20 dark:text-purple-300">Cyt</span>' : ''}${s.received ? i('checkCircle', 14, 'text-green-500') : ''}</div></div>${s.specimenDetail ? `<p class="text-xs text-slate-600 dark:text-slate-300">${s.specimenDetail}</p>` : ''}${s.remarks ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${s.remarks}</p>` : ''}</div>`).join('');
    return `<div id="drawerBackdrop" class="fixed inset-0 z-40 flex justify-end"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in no-print" onclick="closeDrawer()"></div><div id="drawerCard" class="relative w-full max-w-xl bg-white dark:bg-slate-900 shadow-elevated animate-slide-in overflow-y-auto"><div class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-5 py-4 flex items-center justify-between no-print"><div><h3 class="text-lg font-bold text-slate-900 dark:text-white">Transfer Details</h3><p class="text-xs font-mono text-slate-500 mt-0.5">${t.id}</p></div><div class="flex items-center gap-2"><button onclick="window.print()" class="btn-secondary text-sm">${i('printer', 16)}Print</button><button onclick="closeDrawer()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${i('x', 20)}</button></div></div><div class="p-5 space-y-5"><div class="flex items-center gap-2 flex-wrap">${StatusBadge(t.status)}${PriorityBadge(t.priority)}${t.samples.some(s => s.cytology) ? '<span class="badge bg-purple-100 text-purple-700 dark:bg-purple-500/20 dark:text-purple-300">Cytology</span>' : ''}</div><div><div class="flex items-center gap-2 mb-3">${i('user', 16, 'text-brand-500')}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Patient Information</h4></div><div class="grid grid-cols-2 gap-3"><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">MRN</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5 font-mono">${t.mrn}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Patient Name</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${displayName(t)}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Location</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.location}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Area</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.department}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Consultant</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.consultant}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Destination Lab</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${t.destinationLab}</p></div><div><p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide">Collection</p><p class="text-sm text-slate-800 dark:text-slate-200 mt-0.5">${formatDateLong(t.collectionDate)} ${t.collectionTime}</p></div></div></div><div><div class="flex items-center gap-2 mb-3">${i('flask', 16, 'text-brand-500')}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Samples (${t.samples.length})</h4></div><div class="space-y-2">${sampleItems}</div></div>${t.transferNotes ? `<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-200 dark:border-amber-500/20"><p class="text-xs font-semibold text-amber-700 dark:text-amber-400 mb-1">Transfer Notes</p><p class="text-sm text-amber-800 dark:text-amber-300">${t.transferNotes}</p></div>` : ''}${t.labNotes ? `<div class="p-3 rounded-xl bg-cyan-50 dark:bg-cyan-500/10 border border-cyan-200 dark:border-cyan-500/20"><p class="text-xs font-semibold text-cyan-700 dark:text-cyan-400 mb-1">Lab Notes</p><p class="text-sm text-cyan-800 dark:text-cyan-300">${t.labNotes}</p></div>` : ''}<div class="no-print"><div class="flex items-center gap-2 mb-3">${i('qr', 16, 'text-brand-500')}<h4 class="text-sm font-bold text-slate-900 dark:text-white">Transfer ID &amp; Barcode</h4></div><div class="flex items-center gap-6 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800 flex-wrap">${qrCodeSVG(qrPayload(t), 120)}<div class="flex flex-col gap-2">${barcodeSVG(t.id, 40)}<p class="text-[11px] text-slate-400 max-w-[220px]">Scan at ward or lab to pull up this transfer instantly.</p></div></div></div><div class="hidden print:flex print-area flex-col items-center text-center gap-4 p-6"><div class="p-3 bg-white rounded-xl border border-slate-100 dark:border-slate-800">${qrCodeSVG(qrPayload(t), 180)}</div>${barcodeSVG(t.id, 44)}<div><p class="font-mono text-sm font-bold text-slate-900 dark:text-white">${t.id}</p><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${t.mrn} &middot; ${displayName(t)}</p><p class="text-xs text-slate-400 mt-2 max-w-[240px] mx-auto">Scan at ward or lab to pull up this transfer instantly.</p></div></div></div></div></div>`;
  }

  function renderToasts() {
    const icons2 = { success: i('checkCircle', 20, 'text-green-500'), error: i('xCircle', 20, 'text-danger-500'), info: i('info', 20, 'text-brand-500'), warning: i('alert', 20, 'text-amber-500') };
    const borders = { success: 'border-l-green-500', error: 'border-l-red-500', info: 'border-l-brand-500', warning: 'border-l-amber-500' };

  }

  function renderCancelModal() {
    if (!state.cancelModalTransferId) return '';
    const t = getTransfer(state.cancelModalTransferId);
    if (!t) return '';
    const isOther = state.cancelReasonSelect === 'Other (please specify)';
    return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in" onclick="closeCancelModal()"></div><div class="relative w-full max-w-md card shadow-elevated animate-scale-in"><div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800"><div><h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Cancel Transfer Request</h3><p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${t.caseId || t.id} &middot; ${t.mrn} &middot; ${displayName(t)}</p></div><button onclick="closeCancelModal()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${i('x', 20)}</button></div><div class="px-6 py-5 space-y-4"><p class="text-sm text-slate-600 dark:text-slate-300">Please select a reason for cancelling this transfer. It will be removed from all queues.</p><div><label class="label">Reason <span class="text-danger-500">*</span></label><select class="input" onchange="state.cancelReasonSelect=this.value;render()"><option value="">Select a reason...</option>${CANCEL_REASONS.map(r => `<option value="${r}" ${state.cancelReasonSelect === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>${isOther ? `<div><label class="label">Please specify <span class="text-danger-500">*</span></label><textarea class="input" rows="3" placeholder="Enter details..." oninput="state.cancelReasonOther=this.value">${state.cancelReasonOther || ''}</textarea></div>` : ''}</div><div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3"><button onclick="closeCancelModal()" class="btn-secondary">Back</button><button onclick="submitCancelTransfer()" class="btn-danger">${i('cancel', 15)} Confirm Cancellation</button></div></div></div>`;
  }

  function renderConfirmModal() {
    if (!state.confirmModal) return '';
    const m = state.confirmModal;
    return `<div class="fixed inset-0 z-50 flex items-center justify-center p-4"><div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm animate-fade-in" onclick="state.confirmModal=null;render()"></div><div class="relative w-full max-w-md card shadow-elevated animate-scale-in"><div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800"><h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">${m.title}</h3></div><div class="px-6 py-5">${m.message ? `<p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${m.message}</p>` : ''}</div><div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3"><button onclick="state.confirmModal=null;render()" class="btn-secondary">Cancel</button><button onclick="(${m.onConfirm.toString()})()" class="btn-danger">Confirm</button></div></div></div>`;
  }

  // ============= MAIN RENDER =============
  function login(persona) {
    if (!state.loginName.trim()) { showToast('warning', 'Please enter your name to sign in'); return; }
    state.persona = persona;
    state.loggedIn = true;
    state.currentPage = 'dashboard';
    state.currentUser = persona === 'theatre'
      ? { name: state.loginName, role: 'Theatre Staff', initials: initialsOf(state.loginName) }
      : { name: state.loginName, role: 'Porters Desk', initials: initialsOf(state.loginName) };
    localStorage.setItem('labtrack_session', JSON.stringify({ persona: state.persona, loginName: state.loginName, currentUser: state.currentUser }));
    render();
  }

  function logout() {
    state.loggedIn = false;
    state.loginName = '';
    state.currentPage = 'dashboard';
    state.profileOpen = false;
    localStorage.removeItem('labtrack_session');
    // Sign-in for every persona now lives on the Unified Dashboard at the bottom of
    // this file, so drop both sessions and reload back to it.
    localStorage.removeItem('labtrack_unified_session');
    window.location.replace(window.location.href.split('?')[0].split('#')[0]);
  }

  function initialsOf(name) {
    return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'U';
  }

  function renderLogin() {
    return `<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4">

        <div class="text-center mb-8">

          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">National University Hospital</p>
        </div>
        <div class="card p-6 space-y-5">
          <div><label class="label">Your Name</label><input id="loginNameInput" class="input" placeholder="e.g. Sarah O'Sullivan" value="${state.loginName}" onkeydown="if(event.key==='Enter')document.getElementById('loginContinue')?.click()" onchange="state.loginName=this.value"></div>

            <label class="label">Sign in as</label>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="state.loginName=document.getElementById('loginNameInput').value;login('theatre')" class="flex flex-col items-center gap-2 p-4 rounded-2xl border-2 border-slate-200 dark:border-slate-700 hover:border-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-all group">
                <div class="w-11 h-11 rounded-xl bg-slate-100 dark:bg-slate-800 group-hover:bg-brand-100 dark:group-hover:bg-brand-500/20 flex items-center justify-center transition-colors">${i('package', 22, 'text-slate-500 group-hover:text-brand-600 dark:group-hover:text-brand-400')}</div>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">Theatre</span>

  }

  function render() {
    if (typeof closeAllHistCombos === 'function') closeAllHistCombos();
    if (!state.loggedIn) {
      document.getElementById('app').innerHTML = renderLogin();
      return;
    }

    // Preserve focus/cursor/scroll across the full re-render so typing or
    // picking a dropdown doesn't feel like the page "refreshed".
    const active = document.activeElement;
    let restore = null;
    if (active && ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName) && document.getElementById('app').contains(active)) {
      restore = {
        tag: active.tagName.toLowerCase(),
        onchange: active.getAttribute('onchange'),
        oninput: active.getAttribute('oninput'),
        selStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
        selEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
      };
    }
    const scrollEl = document.scrollingElement || document.documentElement;
    const scrollTop = scrollEl.scrollTop;

    let content = '';
    if (state.searchQuery) { content = renderSearchResults(); } else {
      switch (state.currentPage) {
        case 'dashboard': content = state.persona === 'porters' ? renderPortersHome() : renderDashboard(); break;
        case 'create': content = renderCreateTransfer(); break;
        case 'pending': content = renderTheatrePending(); break;
        case 'transit': content = renderTheatreTransit(); break;
        case 'history': content = renderHistory(); break;
        case 'reports': content = renderReports(); break;
        default: content = renderDashboard();
      }
    }
    document.getElementById('app').innerHTML = renderAppShell(content) + renderDrawer() + renderQrModal() + renderCancelModal() + renderToasts() + renderConfirmModal();

    if (restore) {
      const candidates = document.getElementsByTagName(restore.tag);
      for (const el of candidates) {
        if (el.getAttribute('onchange') === restore.onchange && el.getAttribute('oninput') === restore.oninput) {
          el.focus({ preventScroll: true });
          if (restore.selStart !== null && el.setSelectionRange) {
            try { el.setSelectionRange(restore.selStart, restore.selEnd); } catch (e) {}
          }
          break;
        }
      }
    }
    scrollEl.scrollTop = scrollTop;
  }

  // Auto sign-in when arriving from the LabTrack Unified Dashboard login page,
  // e.g. LabTrack_MVp.html?autologin=theatre&name=Theatre%20Staff
  let autoLoginApplied = false;
  try {
    const urlParams = new URLSearchParams(window.location.search);
    let autoPersona = urlParams.get('autologin');
    if (autoPersona === 'admin' || autoPersona === 'porter') autoPersona = 'porters';
    if (autoPersona && PERSONA_PAGES[autoPersona]) {
      const autoName = urlParams.get('name') ||
        (autoPersona === 'theatre' ? 'Theatre Staff' : 'Porters Desk');
      state.loggedIn = true;
      state.persona = autoPersona;
      state.loginName = autoName;
      state.currentUser = autoPersona === 'theatre'
        ? { name: autoName, role: 'Theatre Staff', initials: initialsOf(autoName) }
        : { name: autoName, role: 'Porters Desk', initials: initialsOf(autoName) };
      localStorage.setItem('labtrack_session', JSON.stringify({ persona: state.persona, loginName: state.loginName, currentUser: state.currentUser }));
      autoLoginApplied = true;
    }
  } catch (e) {}

  // Restore session if one exists
  if (!autoLoginApplied) {
    const savedSession = localStorage.getItem('labtrack_session');
    if (savedSession) {
      try {
        const s = JSON.parse(savedSession);
        if (s.persona === 'admin' || s.persona === 'porter') s.persona = 'porters';
        if (s.persona && PERSONA_PAGES[s.persona]) {
          state.loggedIn = true;
          state.persona = s.persona;
          state.loginName = s.loginName;
          state.currentUser = s.currentUser;
        } else {
          localStorage.removeItem('labtrack_session');
        }
      } catch (e) { localStorage.removeItem('labtrack_session'); }
    }
  }

  // Initialize
  render();
</script>

  const dirOf = (view) => view === 'internal' ? state.internalDirection : state.externalDirection;

  const currentLab = () => (state.user && state.user.lab) || '';
  const ownedByLab = (rec) => rec.owner === currentLab();

  // Every dropdown in this dashboard is presented A–Z, so the lists below are
  // sorted once here rather than relying on the order they happen to be typed in.
  const alpha = (list) => list.slice().sort((a, b) => String(a).localeCompare(String(b)));

  const INTERNAL_LAB = 'Haematology';

  // What the Create Request form offers for each system + direction. A `locked`
  // side is shown pre-filled and disabled; the other side is a dropdown.
  function requestFormSpec(view, direction) {
    if (view === 'internal') {
      return direction === 'outbound'
        ? { pickupLocked: INTERNAL_LAB, pickupOptions: null, deliveryLocked: null, deliveryOptions: WARD_LOCATIONS, sampleTypes: BLOOD_PRODUCT_TYPES }

    return direction === 'outbound'
      ? { pickupLocked: ORGANISATION, pickupOptions: null, deliveryLocked: null, deliveryOptions: PARTNER_HOSPITALS, sampleTypes: BLOOD_PRODUCT_TYPES }

  const LAB_OPTIONS = alpha(['Haematology', 'Histopathology', 'Cytology', 'Biochemistry', 'Microbiology', 'Immunology', 'Blood Bank']);

  const SAMPLE_TYPES_EXTERNAL = SAMPLE_TYPES_INTERNAL;

  const INTERNAL_STEPS = [

    { status:'delivered',  label:'Delivered',          detail: r => 'Signed for at ' + r.delivery },
  ];

  function buildTimeline(steps, record, startIso, endIso) {
    const reached = steps.findIndex(s => s.status === record.status);
    const idx = reached < 0 ? 0 : reached;
    const start = new Date(startIso).getTime();
    const end = new Date(endIso).getTime();
    const span = Math.max(end - start, 0);
    return steps.slice(0, idx + 1).map((s, n) => ({
      label: s.label,
      detail: s.detail(record),
      at: new Date(idx === 0 ? start : start + (span * n) / idx).toISOString(),
      current: n === idx,
    }));
  }

  function timelineHtml(events, accent) {
    return events.map((e, n) => {
      const last = n === events.length - 1;
      const dot = e.current ? accent : 'bg-slate-300 dark:bg-slate-600';
      return '<div class="flex gap-3">' +

          '<p class="text-sm font-semibold text-slate-800 dark:text-slate-200">' + esc(e.label) + '</p>' +
