  /* ============================================================
     6b. Request Details fields — the shared field set (Request/Accepted/
         Collection/Delivery/Cancellation date & time, plus contacts) used
         by the detail drawer for both internal and external records.
     ============================================================ */
  const pad2 = (n) => String(n).padStart(2, '0');
  const localDate = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const localTime = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const dateOrDash = (iso) => iso ? localDate(new Date(iso)) : '—';
  const timeOrDash = (iso) => iso ? localTime(new Date(iso)) : '—';

  // Demo build: the seed data only carries a request and a last-update stamp, so the
  // collection and delivery stamps are derived from the record id. The seed is a plain
  // hash of the id, which means a given request always shows the same times — they look
  // like real data and never shuffle between renders. Swap these two helpers out for the
  // real timestamps once the backing systems are wired up.
  const seedOf = (s) => {
    let h = 7;
    const str = String(s);
    for (let n = 0; n < str.length; n++) h = (h * 31 + str.charCodeAt(n)) >>> 0;
    return h;
  };
  const pick = (seed, step, min, max) => min + ((seed >>> (step * 4)) % (max - min + 1));
  const plusMins = (iso, mins) => new Date(new Date(iso).getTime() + mins * 60000).toISOString();

  function externalDetailFields(r) {
    const cancelled = r.status === 'cancelled';
    if (r.stamps) {
      const st = r.stamps;
      return {
        requestDate: dateOrDash(r.requestedAt), requestTime: timeOrDash(r.requestedAt),
        acceptedDate: dateOrDash(st.accepted), acceptedTime: timeOrDash(st.accepted),
        collectionDate: dateOrDash(st.collected), collectionTime: timeOrDash(st.collected),
        deliveryDate: dateOrDash(st.delivered), deliveryTime: timeOrDash(st.delivered),
        cancellationDate: dateOrDash(cancelled ? r.updatedAt : null), cancellationTime: timeOrDash(cancelled ? r.updatedAt : null),
        collectionContact: r.pickup + ' Transport Desk', deliveryContact: r.delivery + ' Reception',
      };
    }
    const seed = seedOf(r.id);
    const acceptedAt = plusMins(r.requestedAt, pick(seed, 0, 10, 40));
    const collectionAt = cancelled ? null : plusMins(acceptedAt, pick(seed, 1, 35, 95));
    const deliveryAt = cancelled ? null : plusMins(collectionAt, pick(seed, 2, 40, 125));
    const cancellationAt = cancelled ? r.updatedAt : null;
    return {
      requestDate: dateOrDash(r.requestedAt), requestTime: timeOrDash(r.requestedAt),
      acceptedDate: dateOrDash(acceptedAt), acceptedTime: timeOrDash(acceptedAt),
      collectionDate: dateOrDash(collectionAt), collectionTime: timeOrDash(collectionAt),
      deliveryDate: dateOrDash(deliveryAt), deliveryTime: timeOrDash(deliveryAt),
      cancellationDate: dateOrDash(cancellationAt), cancellationTime: timeOrDash(cancellationAt),
      collectionContact: r.pickup + ' Transport Desk',
      deliveryContact: r.delivery + ' Reception',
    };
  }

  function internalDetailFields(t) {
    if (t.stamps) {
      const st = t.stamps;
      return {
        requestDate: dateOrDash(t.createdAt), requestTime: timeOrDash(t.createdAt),
        acceptedDate: dateOrDash(st.accepted), acceptedTime: timeOrDash(st.accepted),
        collectionDate: dateOrDash(st.collected), collectionTime: timeOrDash(st.collected),
        deliveryDate: dateOrDash(st.delivered), deliveryTime: timeOrDash(st.delivered),
        cancellationDate: null, cancellationTime: null,
        collectionContact: t.porter || 'Porters Desk', deliveryContact: t.lab + ' Reception',
      };
    }
    const seed = seedOf(t.id);
    const acceptedAt = plusMins(t.createdAt, pick(seed, 0, 8, 30));
    const collectionAt = plusMins(acceptedAt, pick(seed, 1, 20, 65));
    const deliveryAt = plusMins(collectionAt, pick(seed, 2, 25, 80));
    return {
      requestDate: dateOrDash(t.createdAt), requestTime: timeOrDash(t.createdAt),
      acceptedDate: dateOrDash(acceptedAt), acceptedTime: timeOrDash(acceptedAt),
      collectionDate: dateOrDash(collectionAt), collectionTime: timeOrDash(collectionAt),
      deliveryDate: dateOrDash(deliveryAt), deliveryTime: timeOrDash(deliveryAt),
      cancellationDate: null, cancellationTime: null,
      collectionContact: t.porter || 'Porters Desk',
      deliveryContact: t.lab + ' Reception',
    };
  }

  // Rows that have nothing behind them are dropped rather than printed as a dash, so the
  // panel only ever shows fields that carry a value (Cancellation only on a cancelled record).
  function detailFieldsGrid(f) {
    const filled = (v) => !!v && v !== '—' && v !== '-';
    const pairs = [
      ['Request Date', f.requestDate, 'Request Time', f.requestTime],
      ['Accepted Date', f.acceptedDate, 'Accepted Time', f.acceptedTime],
      ['Collection Date', f.collectionDate, 'Collection Time', f.collectionTime],
      ['Delivery Date', f.deliveryDate, 'Delivery Time', f.deliveryTime],
      ['Cancellation Date', f.cancellationDate, 'Cancellation Time', f.cancellationTime],
    ];
    return '<div class="grid grid-cols-2 gap-4">' +
      pairs.filter(p => filled(p[1])).map(p => field(p[0], esc(p[1])) + field(p[2], esc(p[3]))).join('') +
      (filled(f.collectionContact) ? field('Collection Contact', esc(f.collectionContact)) : '') +
      (filled(f.deliveryContact) ? field('Delivery Contact', esc(f.deliveryContact)) : '') +
    '</div>';
  }

  /* ============================================================
     6c. Analytics demo volume
         A seeded (so it never changes between reloads) fortnight of traffic
         across every lab, shaped like a real hospital day: quiet overnight,
         a morning rush from 08:00, a lunch dip, a second peak mid-afternoon.
         Each record carries real stage stamps so the waypoints line up.
         Remove this block once the live feeds are wired up.
     ============================================================ */
  (function seedAnalyticsDemo() {
    let s = 20260918;
    const rnd = () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const pickW = (pairs) => { const tot = pairs.reduce((a, p) => a + p[1], 0); let r = rnd() * tot; for (const p of pairs) { if ((r -= p[1]) < 0) return p[0]; } return pairs[pairs.length - 1][0]; };
    const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const HOUR_W = [1,1,1,1,1,2,3,6,10,12,13,11,8,9,11,12,10,7,5,4,3,2,2,1].map((w, h) => [h, w]);
    // Blood is the bread and butter of the service, so the blood-heavy labs carry
    // the most traffic and blood appears in every lab's mix.
    const LAB_W = [['Haematology',40],['Biochemistry',34],['Microbiology',10],['Cytology',5],['Immunology',5],['Histopathology',6]];
    const SAMPLES_FOR = {
      Haematology: [['Blood',1]], Biochemistry: [['Blood',8],['Urine',1]], Immunology: [['Blood',1]],
      Microbiology: [['Blood',8],['Swab',4],['Urine',3],['Stool',2],['Sputum',2],['CSF',1]],
      Cytology: [['Blood',5],['Urine',2],['Sputum',2],['Swab',1]], Histopathology: [['Blood',3],['Tissue biopsy',3]],
    };
    const WARDS = [['Emergency Department',30],['OPD',18],['Theatre 1',10],['Theatre 2',8],['ICU',10],['Delivery Suite',8],['Ward 4B',10],['Day Ward',6]];
    const HOSP_W = PARTNER_HOSPITALS.map((h, n) => [h, [26, 18, 12, 10, 22, 12][n] || 10]);
    const FIRST = ['Aoife','Ciara','Niamh','Sean','Conor','Liam','Orla','Declan','Emer','Ronan','Grainne','Padraig','Siobhan','Cian','Roisin','Eoin'];
    const LAST = ['Byrne','Murphy','Kelly','Walsh','Ryan','Doyle','Nolan','Keane','Lynch','Dunne','Quinn','Moran','Casey','Foley','Hegarty','Brennan'];
    const PORTERS = ['Michael Byrne','Liam Doyle','Aoife Nolan',"James O'Brien",'Sean Kavanagh','Declan Murphy','Niamh Foley','Cathal Egan'];
    const localIso = (d) => localDate(d) + 'T' + localTime(d) + ':00';
    const now = Date.now();
    const DAYS = 14;
    let intSeq = 10001;

    for (let day = DAYS - 1; day >= 0; day--) {
      const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() - day);
      // ---- internal ----
      const nInt = rint(30, 42);
      for (let k = 0; k < nInt; k++) {
        const created = new Date(base.getTime() + (pickW(HOUR_W) * 60 + rint(0, 59)) * 60000);
        if (created.getTime() > now) continue;
        const outbound = rnd() < 0.16;
        const urgent = rnd() < (outbound ? 0.45 : 0.3);
        const lab = outbound ? 'Haematology' : pickW(LAB_W);
        const f = urgent ? 0.6 : 1;
        const assigned = created.getTime() + rint(4, 22) * f * 60000;
        const collected = assigned + rint(8, 35) * f * 60000;
        const delivered = collected + rint(10, 40) * f * 60000;
        const status = delivered <= now ? (now - delivered > 3 * 3600000 ? 'completed' : 'received')
                     : collected <= now ? 'in_transit' : assigned <= now ? 'assigned' : 'pending';
        const iso = (t) => t <= now ? new Date(t).toISOString() : null;
        const last = [delivered, collected, assigned, created.getTime()].find(t => t <= now);
        const specimen = outbound ? BLOOD_PRODUCT_TYPES[rint(0, BLOOD_PRODUCT_TYPES.length - 1)] : pickW(SAMPLES_FOR[lab]);
        INTERNAL_FEED.push({
          id: 'TRX-2026-' + (intSeq++), mrn: 'MRN-00' + rint(100000, 999999),
          patient: FIRST[rint(0, FIRST.length - 1)] + ' ' + LAST[rint(0, LAST.length - 1)],
          pickup: outbound ? 'Haematology' : pickW(WARDS),
          lab: outbound ? pickW(WARDS) : lab, owner: lab, direction: outbound ? 'outbound' : 'inbound',
          status: status, priority: urgent ? 'Urgent' : 'Routine',
          samples: specimen === 'Blood' ? rint(3, 6) : rint(1, 3),
          specimen: specimen,
          requestedBy: 'Ward staff', porter: status === 'pending' ? '' : PORTERS[rint(0, PORTERS.length - 1)], notes: '',
          createdAt: created.toISOString(), updatedAt: new Date(last).toISOString(),
          stamps: { accepted: iso(assigned), collected: iso(collected), delivered: iso(delivered) },
        });
      }
      // ---- external ----
      const nExt = rint(10, 16);
      let extSeq = 5001;
      for (let k = 0; k < nExt; k++) {
        const req = new Date(base.getTime() + (pickW(HOUR_W) * 60 + rint(0, 59)) * 60000);
        if (req.getTime() > now) continue;
        const inbound = rnd() < 0.62;
        const lab = inbound ? pickW(LAB_W) : (rnd() < 0.85 ? 'Haematology' : 'Immunology');
        const urgent = rnd() < 0.3;
        const cancelled = rnd() < 0.05;
        const accepted = req.getTime() + rint(2, 20) * 60000;
        const collected = accepted + rint(20, 60) * 60000;
        const delivered = collected + rint(20, 55) * 60000;
        let status = delivered <= now ? 'delivered' : collected <= now ? 'in_transit' : accepted <= now ? (rnd() < 0.5 ? 'assigned' : 'accepted') : 'accepted';
        if (cancelled) status = 'cancelled';
        const iso = (t) => (!cancelled && t <= now) ? new Date(t).toISOString() : null;
        const hosp = pickW(HOSP_W);
        const d = req;
        const sampleType = inbound ? pickW(SAMPLES_FOR[lab]) : BLOOD_PRODUCT_TYPES[rint(0, BLOOD_PRODUCT_TYPES.length - 1)];
        EXTERNAL_FEED.push({
          id: 'H' + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()) + (extSeq++),
          owner: lab, direction: inbound ? 'inbound' : 'outbound',
          pickup: inbound ? hosp : ORGANISATION, delivery: inbound ? ORGANISATION : hosp,
          sampleType: sampleType,
          samples: sampleType === 'Blood' ? rint(3, 5) : rint(1, 2), status: status, urgency: urgent ? 'urgent' : 'standard',
          requestedAt: localIso(req), updatedAt: localIso(new Date(cancelled ? Math.min(now, accepted) : Math.min(now, [delivered, collected, accepted, req.getTime()].find(t => t <= now) || req.getTime()))),
          notes: cancelled ? 'Cancelled - sample no longer required.' : '',
          stamps: { accepted: cancelled ? new Date(accepted).toISOString() : iso(accepted), collected: iso(collected), delivered: iso(delivered) },
        });
      }
    }
  })();

  /* ============================================================
     7. State

  // `*Other` holds the free-text value typed after picking "Other" in a dropdown.
  function defaultRequestForm() {
    return {
      pickup: '', pickupOther: '',
      lab: '', labOther: '',
      delivery: '', deliveryOther: '',
      numSamples: 1,
      sampleType: '', sampleTypeOther: '',
      contact: '', urgency: 'standard', notes: '',
      // Create Request no longer offers a direction — every request raised here is
      // the lab sending something out, so the form is always the outbound shape.
      direction: 'outbound',
    };
  }

  // Resolves a dropdown value: "Other" falls back to whatever was typed beside it.
  function resolveOther(value, otherValue) {
    return value === 'Other' ? String(otherValue || '').trim() : value;
  }

  const state = {
    loggedIn: false,
    loginName: '',
    user: null,
    view: 'internal',
    drawerId: null,
    sidebarOpen: false,
    section: 'dashboard', // 'dashboard' | 'create' | 'history' | 'analytics'
    requestForm: defaultRequestForm(),
    requestError: '',
    // Dashboard tables — driven by the tiles above them.
    internalSearch: '', internalSearchField: 'all', internalStatus: 'all', internalPage: 1,
    externalSearch: '', externalSearchField: 'all', externalStatus: 'all', externalPage: 1,
    dashPerPage: 5,
    // Inbound / Outbound toggle — one per system, shared by dashboard, history and
    // the default on Create Request.
    internalDirection: 'inbound', externalDirection: 'inbound',
    // Analytics page — its own period / click-to-filter. `anDateFrom` / `anDateTo`
    // are only used (and only shown) while the period is "All time".
    anPeriod: '24h', anFilter: null, anDateFrom: '', anDateTo: '',
    // History pages — same filter as the dashboard (search only), own state/pages.
    histInternalSearch: '', histInternalSearchField: 'all', histInternalPage: 1,
    histExternalSearch: '', histExternalSearchField: 'all', histExternalPage: 1,
    histPerPage: 10,
  };

  const SESSION_KEY = 'labtrack_unified_session';

  function login() {
    const emailInput = document.getElementById('loginEmailInput');
    const passInput = document.getElementById('loginPasswordInput');
    const email = (emailInput ? emailInput.value : '').trim().toLowerCase();
    const password = passInput ? passInput.value : '';
    const err = document.getElementById('loginError');
    const account = CREDENTIALS[email];
    if (!account || account.password !== password) {
      if (err) { err.textContent = 'Incorrect email or password.'; err.classList.remove('hidden'); }
      return;
    }
    if (account.persona === 'theatre' || account.persona === 'porter') {
      // Theatre and Porter work out of the LabTrack MVP, which now lives further up
      // this same file. Hand over by writing the session key the MVP looks for on
      // boot, then reload so it comes up already signed in.
      const mvpPersona = account.persona === 'porter' ? 'porters' : 'theatre';
      localStorage.setItem('labtrack_session', JSON.stringify({
        persona: mvpPersona,
        loginName: account.name,
        currentUser: {
          name: account.name,
          role: mvpPersona === 'theatre' ? 'Theatre Staff' : 'Porters Desk',
          initials: initialsOf(account.name),
        },
      }));
      localStorage.removeItem(SESSION_KEY);
      window.location.replace(window.location.href.split('?')[0].split('#')[0]);
      return;
    }
    // Lab persona lands on the unified dashboard itself — this is now their only workspace.
    state.loggedIn = true;
    state.loginName = account.name;
    state.user = { name: account.name, role: 'Laboratory Staff', lab: account.lab, initials: initialsOf(account.name) };
    localStorage.setItem(SESSION_KEY, JSON.stringify({ loginName: state.loginName, user: state.user }));
    render();
  }
  function logout() {
    state.loggedIn = false; state.loginName = ''; state.user = null;
    state.view = 'internal'; state.drawerId = null;
    state.sidebarOpen = false; state.section = 'dashboard'; state.requestForm = defaultRequestForm(); state.requestError = '';
    localStorage.removeItem(SESSION_KEY);
    render();
  }
  function setView(v) { state.view = v; state.drawerId = null; state.anFilter = null; render(); }
  function openDetail(id) { state.drawerId = id; render(); }
  function closeDetail() { state.drawerId = null; render(); }
  // Each table's filters share a prefix with its page counter, so changing any
  // filter sends that table back to page 1.
  const PAGE_KEY_FOR = {
    histInternal: 'histInternalPage', histExternal: 'histExternalPage',
    internal: 'internalPage', external: 'externalPage',
  };
  function setField(key, value) {
    state[key] = value;
    Object.keys(PAGE_KEY_FOR).forEach(function (prefix) {
      const pageKey = PAGE_KEY_FOR[prefix];
      if (key.indexOf(prefix) === 0 && key !== pageKey) state[pageKey] = 1;
    });
    if (key === 'dashPerPage') { state.internalPage = 1; state.externalPage = 1; }
    if (key === 'internalDirection') { state.internalStatus = 'all'; state.histInternalPage = 1; }
    if (key === 'externalDirection') { state.externalStatus = 'all'; state.histExternalPage = 1; }
    if (key === 'histPerPage') { state.histInternalPage = 1; state.histExternalPage = 1; }

  }

      state.internalPage = 1;
    } else {

      state.externalPage = 1;

  /* ============================================================
     7b. Sidebar navigation + Create Request form

  function toggleSidebar() { state.sidebarOpen = !state.sidebarOpen; render(); }

    state.requestError = ''; render();

  function submitRequest() {
    const f = state.requestForm;
    const isInternal = state.view === 'internal';
    const direction = f.direction === 'outbound' ? 'outbound' : 'inbound';
    const spec = requestFormSpec(state.view, direction);
    if (spec.pickupLocked) f.pickup = spec.pickupLocked;
    if (spec.deliveryLocked) f.delivery = spec.deliveryLocked;
    const pickup = resolveOther(f.pickup, f.pickupOther);
    const delivery = resolveOther(f.delivery, f.deliveryOther);
    const sampleType = resolveOther(f.sampleType, f.sampleTypeOther);
    const lab = resolveOther(f.lab, f.labOther);
    if (!pickup || !delivery || !sampleType || !String(f.contact).trim() || (!isInternal && !lab)) {
      state.requestError = 'Please fill in all required fields.';
      render();
      return;
    }
    const nowIso = new Date().toISOString();
    if (isInternal) {
      const nums = INTERNAL_FEED.map(t => parseInt((t.id.split('-').pop() || '0'), 10)).filter(n => !isNaN(n));
      const nextNum = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
      INTERNAL_FEED.unshift({
        id: 'TRX-2026-' + String(nextNum).padStart(5, '0'),
        mrn: 'MRN-PENDING', patient: 'New request', pickup: pickup, lab: delivery,
        owner: currentLab(), direction: direction,
        status: 'pending', priority: f.urgency === 'urgent' ? 'Urgent' : 'Routine',
        samples: Number(f.numSamples) || 1, specimen: sampleType,
        requestedBy: state.user ? state.user.name : 'Lab', porter: '', notes: f.notes,
        createdAt: nowIso, updatedAt: nowIso,
      });
    } else {
      const stamp = nowIso.slice(2, 4) + nowIso.slice(5, 7) + nowIso.slice(8, 10);
      const seq = String(EXTERNAL_FEED.filter(r => r.id.indexOf('H' + stamp) === 0).length + 1).padStart(4, '0');
      EXTERNAL_FEED.unshift({
        id: 'H' + stamp + seq, owner: currentLab(), direction: direction,
        pickup: pickup, lab: lab, delivery: delivery, sampleType: sampleType,
        status: 'accepted', urgency: f.urgency, requestedAt: nowIso, updatedAt: nowIso, notes: f.notes,
      });
    }
    // Land on the history for the direction just used, so the new request is visible.
    state[isInternal ? 'internalDirection' : 'externalDirection'] = direction;
    state.section = 'history';
    state.requestForm = defaultRequestForm();
    state.requestError = '';
    render();
  }
  function markReceived(id) {

    return '<div class="space-y-3">' +
      (active
        ? '<div class="flex items-center justify-end">' +
            '<button onclick="UD.resetDashboardFilters()" class="u-btn-outline text-xs px-3 py-1.5">' + i('x', 13) + 'Reset</button>' +
          '</div>'
        : '') +
      '<div class="grid grid-cols-1 ' + (gridCols || 'sm:grid-cols-2 xl:grid-cols-4') + ' gap-4">' +
        tiles.map(c => tile(c, stateKey, activeValue)).join('') +
      '</div>' +
    '</div>';
  }

  // Column picker sits in front of the search box: choose a column, then the search
  // only looks inside that column. "All columns" searches every listed column.
  function searchControls(fields, fieldKey, searchKey) {
    const selected = state[fieldKey] || 'all';
    const placeholder = 'Search';
    // Columns are listed A–Z; "Filter" stays pinned at the top as the reset choice.
    const sorted = fields.slice().sort((a, b) => a.label.localeCompare(b.label));
    return '<div class="flex items-center gap-2 flex-wrap">' +
      '<select class="u-input py-1.5 text-sm w-44" onchange="UD.setField(\'' + fieldKey + '\', this.value)">' +
        '<option value="all"' + (selected === 'all' ? ' selected' : '') + '>Filter</option>' +
        sorted.map(f => '<option value="' + f.id + '"' + (selected === f.id ? ' selected' : '') + '>' + esc(f.label) + '</option>').join('') +
      '</select>' +
      '<div class="relative w-full sm:w-60">' +
        i('search', 15, 'absolute left-3 top-1/2 -translate-y-1/2 text-slate-400') +
        '<input class="u-input pl-9 py-1.5 text-sm" value="' + esc(state[searchKey]) + '" placeholder="' + esc(placeholder) + '" ' +
          'onchange="UD.setField(\'' + searchKey + '\', this.value)">' +
      '</div>' +
    '</div>';
  }

  // True when the record matches the query in the selected column (or in any column
  // when "All columns" is chosen).
  function matchesSearch(rec, fields, fieldKey, query) {
    if (!query) return true;
    const selected = state[fieldKey] || 'all';
    const searchIn = selected === 'all' ? fields : fields.filter(f => f.id === selected);
    return searchIn.some(f => String(f.get(rec) || '').toLowerCase().indexOf(query) > -1);
  }

  function emptyRow(cols, message) {
    return '<tr><td colspan="' + cols + '" class="px-5 py-12 text-center">' +
      '<p class="text-sm font-semibold text-slate-600 dark:text-slate-300">' + message + '</p>' +
      '<p class="text-xs text-slate-400 mt-1">Adjust the filters above to widen the search.</p>' +
    '</td></tr>';
  }

  const field = (label, value) =>
    '<div><p class="u-field-label">' + label + '</p><p class="u-field-value">' + (value || '&mdash;') + '</p></div>';

  const PER_PAGE_OPTIONS = [5, 10, 15];

  function pageBtn(label, targetPage, disabled, activeStyle, pageKey) {
    return '<button ' + (disabled ? 'disabled' : 'onclick="UD.setField(\'' + pageKey + '\',' + targetPage + ')"') +
      ' class="px-3.5 py-1.5 rounded-lg text-xs font-semibold border transition-colors ' +
      (activeStyle ? 'bg-slate-900 text-white border-slate-900'
                   : disabled ? 'text-slate-300 border-slate-200 cursor-not-allowed dark:text-slate-600 dark:border-slate-800'
                              : 'text-slate-600 border-slate-300 hover:bg-slate-50 dark:text-slate-300 dark:border-slate-700 dark:hover:bg-slate-800') +
      '">' + label + '</button>';
  }

  // "N per page" picker — 5, 10 or 15 rows.
  function perPageSelect(perPageKey) {
    return '<select class="u-input py-1.5 text-sm w-28" onchange="UD.setField(\'' + perPageKey + '\', Number(this.value))">' +
      PER_PAGE_OPTIONS.map(function (n) {
        return '<option value="' + n + '"' + (state[perPageKey] === n ? ' selected' : '') + '>' + n + ' / page</option>';
      }).join('') +
    '</select>';
  }

  // Inbound / Outbound segmented toggle. `onPick` is the JS called with the value.
  function directionSwitch(current, onPickJs, accent) {
    const btn = (id, label, icon) => {
      const active = current === id;
      const on = accent === 'ext' ? 'bg-ext-600 text-white shadow-sm' : 'bg-brand-600 text-white shadow-sm';
      return '<button type="button" onclick="' + onPickJs.replace('%V', id) + '" aria-pressed="' + active + '" ' +
        'class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold transition-colors ' +
        (active ? on : 'text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700') + '">' +
        i(icon, 14) + label + '</button>';
    };
    return '<div class="inline-flex items-center gap-1 p-1 rounded-lg bg-slate-100 dark:bg-slate-800" role="group" aria-label="Direction">' +
      btn('inbound', 'Inbound', 'inbound') + btn('outbound', 'Outbound', 'outbound') +
    '</div>';
  }
  // The toggle that sits beside the per-page picker on the dashboards and history.
  function directionToggle(view) {
    const key = view === 'internal' ? 'internalDirection' : 'externalDirection';
    return directionSwitch(state[key], "UD.setField('" + key + "','%V')", view === 'internal' ? 'brand' : 'ext');
  }
  // Small pill used in tables and the drawer.
  function DirectionBadge(dir) {
    return dir === 'outbound'
      ? '<span class="u-badge bg-violet-50 text-violet-700 border-violet-200 dark:bg-violet-900/30 dark:text-violet-300 dark:border-violet-800">' + i('outbound', 12) + 'Outbound</span>'
      : '<span class="u-badge bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-800">' + i('inbound', 12) + 'Inbound</span>';
  }

  // Footer bar: row count on the left, page buttons on the right. The per-page
  // picker itself now sits up in the filter row, parallel to the other filters.
  function paginationBar(page, totalPages, pageKey, totalRows, perPageKey) {
    const perPage = state[perPageKey];
    const first = totalRows === 0 ? 0 : (page - 1) * perPage + 1;
    const last = Math.min(page * perPage, totalRows);
    // Just Prev / current page / Next — no long run of numbered buttons.
    const current = '<span class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white border border-slate-900">' +
      page + ' of ' + totalPages + '</span>';
    return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-5 py-4 border-t border-slate-100 dark:border-slate-800">' +
      '<p class="text-xs text-slate-500 dark:text-slate-400">Showing ' + first + '&ndash;' + last + ' of ' + totalRows + '</p>' +
      '<div class="flex items-center gap-2 flex-wrap">' +
        pageBtn('Prev', page - 1, page <= 1, false, pageKey) + current + pageBtn('Next', page + 1, page >= totalPages, false, pageKey) +
      '</div>' +
    '</div>';
  }

  // Clamps the stored page number to the number of pages the data actually has.
  function paginate(rows, pageKey, perPageKey) {
    const perPage = state[perPageKey];
    const totalPages = Math.max(1, Math.ceil(rows.length / perPage));
    const page = Math.min(Math.max(1, state[pageKey]), totalPages);
    if (page !== state[pageKey]) state[pageKey] = page;
    return { page: page, totalPages: totalPages, total: rows.length, rows: rows.slice((page - 1) * perPage, page * perPage) };
  }

  // Plain "all + options" filter dropdown used across the history pages.
  function filterSelect(key, allLabel, options, width) {
    return '<select class="u-input py-1.5 text-sm ' + (width || 'w-44') + '" onchange="UD.setField(\'' + key + '\', this.value)">' +
      '<option value="">' + esc(allLabel) + '</option>' +
      options.slice().sort(function (a, b) {
        const la = a.label === undefined ? a : a.label;
        const lb = b.label === undefined ? b : b.label;
        return String(la).localeCompare(String(lb));
      }).map(function (o) {
        const id = o.id === undefined ? o : o.id;
        const label = o.label === undefined ? o : o.label;
        return '<option value="' + esc(id) + '"' + (state[key] === id ? ' selected' : '') + '>' + esc(label) + '</option>';
      }).join('') +
    '</select>';
  }

  function historyHeader(title, subtitle, count) {
    return '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-5 py-4 border-b border-slate-200 dark:border-slate-800">' +
      '<div>' +
        '<h3 class="text-base font-bold text-slate-900 dark:text-white">' + esc(title) + '</h3>' +
        '<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">' + esc(subtitle) + '</p>' +
      '</div>' +
      '<span class="text-xs font-semibold text-slate-500 dark:text-slate-400">' + count + (count === 1 ? ' record' : ' records') + '</span>' +
    '</div>';
  }

  function historyFilterBar(controls, anyActive, extra) {
    return '<div class="flex flex-col lg:flex-row lg:items-center gap-3 px-5 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/20">' +
      '<span class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 dark:text-slate-400 shrink-0">' + i('search', 14) + 'Filter</span>' +
      '<div class="flex items-center gap-2 flex-wrap">' + controls +
        (anyActive ? '<button onclick="UD.clearHistoryFilters()" class="u-btn-outline text-xs px-2.5 py-1.5">' + i('x', 13) + 'Clear</button>' : '') +
      '</div>' +
      (extra ? '<div class="flex items-center gap-2 lg:ml-auto shrink-0">' + extra + '</div>' : '') +
    '</div>';
  }

  /* ============================================================
     8b. Export — takes whatever the history table is currently showing (every
         page of it, with the search filter applied) and hands it to Excel as a
         UTF-8 CSV, which Excel opens natively with no add-ins.
     ============================================================ */
  function exportButton() {
    return '<button onclick="UD.exportHistoryExcel()" ' +
      'class="u-btn-outline text-xs px-2.5 py-1.5 whitespace-nowrap">' + i('download', 13) + 'Export to Excel</button>';
  }

  function historyExportData() {
    if (state.view === 'internal') {
      const q = state.histInternalSearch.trim().toLowerCase();
      const rows = myInternal()
        .filter(t => matchesSearch(t, INTERNAL_SEARCH_FIELDS, 'histInternalSearchField', q))
        .sort(sortTransfers);
      return {
        file: 'LabTrack-StVincents-Referrals-History',
        header: ['Transfer ID', 'Direction', 'MRN', 'Patient', 'Pickup Location', 'Destination', 'Sample Type',
          'Containers', 'Priority', 'Status', 'Request Date', 'Request Time', 'Accepted Date', 'Accepted Time',
          'Collection Date', 'Collection Time', 'Delivery Date', 'Delivery Time',
          'Collection Contact', 'Delivery Contact'],
        body: rows.map(t => {
          const d = internalDetailFields(t);
          return [t.id, t.direction === 'outbound' ? 'Outbound' : 'Inbound', t.mrn, t.patient, t.pickup, t.lab, t.specimen, t.samples, t.priority,
            (INTERNAL_STATUS[t.status] || {}).label || t.status,
            d.requestDate, d.requestTime, d.acceptedDate, d.acceptedTime,
            d.collectionDate, d.collectionTime, d.deliveryDate, d.deliveryTime,
            d.collectionContact, d.deliveryContact];
        }),
      };
    }
    const q = state.histExternalSearch.trim().toLowerCase();
    const rows = myExternal()
      .filter(r => matchesSearch(r, EXTERNAL_SEARCH_FIELDS, 'histExternalSearchField', q))
      .sort(sortExternal);
    return {
      file: 'LabTrack-Community-Referrals-History',
      header: ['Request ID', 'Direction', 'Pickup Location', 'Delivery Location', 'Sample Type', 'Status', 'Urgency Level',
        'Request Date', 'Request Time', 'Accepted Date', 'Accepted Time',
        'Collection Date', 'Collection Time', 'Delivery Date', 'Delivery Time',
        'Collection Contact', 'Delivery Contact', 'Notes'],
      body: rows.map(r => {
        const d = externalDetailFields(r);
        const label = (EXTERNAL_STATUS[r.status] || {}).label || r.status;
        return [r.id, r.direction === 'outbound' ? 'Outbound' : 'Inbound', r.pickup, r.delivery, r.sampleType,
          label.charAt(0).toUpperCase() + label.slice(1),
          r.urgency === 'urgent' ? 'Urgent' : 'Standard',
          d.requestDate, d.requestTime, d.acceptedDate, d.acceptedTime,
          d.collectionDate, d.collectionTime, d.deliveryDate, d.deliveryTime,
          d.collectionContact, d.deliveryContact, r.notes || ''];
      }),
    };
  }

  function exportHistoryExcel() {
    const data = historyExportData();
    // Quote every cell so commas, quotes and apostrophes in hospital names survive.
    const cell = (v) => '"' + String(v === null || v === undefined ? '' : v).replace(/—/g, '-').replace(/"/g, '""') + '"';
    const csv = [data.header].concat(data.body).map(row => row.map(cell).join(',')).join('\r\n');
    const name = data.file + '-' + (isOutbound() ? 'Outbound' : 'Inbound') + '-' + String(currentLab()).replace(/[^A-Za-z0-9]+/g, '') + '-' + localDate(new Date()) + '.csv';
    // The BOM is what tells Excel the file is UTF-8, so accented names open correctly.
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  /* ============================================================
     9. Internal — shared helpers
     ============================================================ */
  const isPending    = t => t.status === 'pending';
  const isAssigned   = t => t.status === 'assigned';
  const isCollected  = t => t.status === 'collected' || t.status === 'in_transit';
  const isDelivered  = t => t.status === 'received' || t.status === 'completed';

  const INTERNAL_STATUS_TESTS = { pending: isPending, assigned: isAssigned, collected: isCollected, delivered: isDelivered };

  // Original ordering, used by both Recent transfers and the History page:
  // everything pending first (longest waiting on top), then in-motion, then
  // delivered — the last two newest-first. Applies inside every filter.
  const groupOf = t => isPending(t) ? 0 : isDelivered(t) ? 2 : 1;
  function sortTransfers(a, b) {
    const ga = groupOf(a), gb = groupOf(b);
    if (ga !== gb) return ga - gb;
    if (ga === 0) return new Date(a.createdAt) - new Date(b.createdAt);
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  }

  // Columns the search box can be pointed at.
  const INTERNAL_SEARCH_FIELDS = [
    { id: 'id',       label: 'Transfer ID',     get: t => t.id },
    { id: 'mrn',      label: 'MRN',             get: t => t.mrn },
    { id: 'patient',  label: 'Patient',         get: t => t.patient },
    { id: 'pickup',   label: 'Pickup location', get: t => t.pickup },
    { id: 'lab',      label: 'Destination',     get: t => t.lab },
    { id: 'specimen', label: 'Sample type',     get: t => t.specimen },
  ];

  const myInternal = () => INTERNAL_FEED.filter(t => ownedByLab(t) && t.direction === state.internalDirection);

  function internalActionCell(t) {
    // Outbound: the ward signs for it, so the lab only watches the progress.
    if (t.direction === 'outbound') {
      return isDelivered(t)
        ? '<span class="inline-flex items-center gap-1 text-xs font-semibold text-cyan-600 dark:text-cyan-400">' + i('checkCircle', 14) + 'Delivered</span>'
        : isPending(t)
        ? '<span class="text-xs font-medium text-amber-600 dark:text-amber-400">Awaiting Collection</span>'
        : isAssigned(t)
        ? '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-indigo-600 dark:text-indigo-400">' + i('user', 14) + esc(t.porter || 'Porter') + '</span>'
        : '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-blue-600 dark:text-blue-400">' + i('truck', 14) + 'On the way</span>';
    }
    return isDelivered(t)
      ? '<span class="inline-flex items-center gap-1 text-xs font-semibold text-cyan-600 dark:text-cyan-400">' + i('checkCircle', 14) + 'Received</span>'
      : isPending(t)
      ? '<span class="text-xs font-medium text-amber-600 dark:text-amber-400">Awaiting Collection</span>'
      // Once the porters desk has assigned someone, the lab just needs to know who is
      // bringing it — the same porter name the Porters persona shows in the MVP.
      : isAssigned(t)
      ? '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-indigo-600 dark:text-indigo-400">' + i('user', 14) + esc(t.porter || 'Porter') + '</span>'
      : '<button onclick="event.stopPropagation();UD.markReceived(\'' + t.id + '\')" class="inline-flex items-center gap-1 text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700 px-3 py-1.5 rounded-lg transition-colors">' + i('checkCircle', 14) + 'Received</button>';
  }

  /* ============================================================
     9a. Internal dashboard — tiles drive the table underneath
     ============================================================ */
  function renderInternal() {
    const mine = myInternal();

    const tiles = [
      { id:'pending',   label:'Pending collection', value:mine.filter(isPending).length,   icon:'clock',       bg:'bg-amber-50 dark:bg-amber-500/10',   iconColor:'text-amber-600 dark:text-amber-400',   ring:'ring-amber-400' },
      { id:'assigned',  label:'Assigned to porter', value:mine.filter(isAssigned).length,  icon:'user',        bg:'bg-indigo-50 dark:bg-indigo-500/10', iconColor:'text-indigo-600 dark:text-indigo-400', ring:'ring-indigo-400' },
      { id:'collected', label:'Porter collected',   value:mine.filter(isCollected).length, icon:'truck',       bg:'bg-blue-50 dark:bg-blue-500/10',     iconColor:'text-blue-600 dark:text-blue-400',     ring:'ring-blue-400' },
      { id:'delivered', label: isOutbound('internal') ? 'Delivered to ward' : 'Delivered to lab', value:mine.filter(isDelivered).length, icon:'checkCircle', bg:'bg-cyan-50 dark:bg-cyan-500/10',     iconColor:'text-cyan-600 dark:text-cyan-400',     ring:'ring-cyan-400' },
    ];
    const out = isOutbound('internal');

    const q = state.internalSearch.trim().toLowerCase();
    const test = INTERNAL_STATUS_TESTS[state.internalStatus];
    const allRows = mine
      .filter(t => matchesSearch(t, INTERNAL_SEARCH_FIELDS, 'internalSearchField', q))
      .filter(t => !test || test(t))
      .sort(sortTransfers);

    const pg = paginate(allRows, 'internalPage', 'dashPerPage');

    const rowHtml = pg.rows.map(t =>
      '<tr class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors cursor-pointer" onclick="UD.openDetail(\'' + t.id + '\')">' +
        '<td class="px-5 py-3.5 font-mono text-xs font-semibold text-slate-800 dark:text-slate-200">' + esc(t.id) + '</td>' +
        '<td class="px-3 py-3.5 font-mono text-xs text-slate-500 dark:text-slate-400 hidden lg:table-cell">' + esc(t.mrn) + '</td>' +
        '<td class="px-3 py-3.5 font-medium text-slate-700 dark:text-slate-300">' + esc(t.patient) + '</td>' +
        '<td class="px-3 py-3.5 text-slate-600 dark:text-slate-400 hidden md:table-cell text-xs">' + esc(t.pickup) + '</td>' +
        '<td class="px-3 py-3.5 text-slate-600 dark:text-slate-400 hidden md:table-cell text-xs">' + esc(t.lab) + '</td>' +
        '<td class="px-3 py-3.5">' + Badge(INTERNAL_STATUS, t.status) + '</td>' +
        '<td class="px-3 py-3.5 text-xs text-slate-500 dark:text-slate-400 hidden sm:table-cell whitespace-nowrap">' + timeAgo(t.updatedAt) + '</td>' +
        '<td class="px-5 py-3.5 text-right">' + internalActionCell(t) + '</td>' +
      '</tr>').join('');

    return '<div class="space-y-6 animate-fade-in">' +
      tileRow(tiles, 'internalStatus', state.internalStatus) +
      '<div class="u-card overflow-hidden">' +
        '<div class="flex flex-col xl:flex-row xl:items-center justify-between gap-3 px-5 py-4 border-b border-slate-200 dark:border-slate-800">' +
          '<div>' +
            '<h3 class="text-base font-bold text-slate-900 dark:text-white">Recent transfers</h3>' +
            '<div class="mt-2">' + directionToggle('internal') + '</div>' +
            '<p class="text-xs text-slate-500 dark:text-slate-400 mt-2">' +
              (out ? 'Going out from ' + esc(currentLab()) + ' to wards and theatres, pending first'
                   : 'Coming in to ' + esc(currentLab()) + ' from wards and theatres, pending first') + '</p>' +
          '</div>' +
          '<div class="flex items-center gap-3 flex-wrap">' +
            searchControls(INTERNAL_SEARCH_FIELDS, 'internalSearchField', 'internalSearch') +
            perPageSelect('dashPerPage') +
          '</div>' +
        '</div>' +
        '<div class="overflow-x-auto"><table class="w-full text-sm">' +
          '<thead><tr class="text-left text-xs text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-slate-800">' +
            '<th class="px-5 py-3 font-semibold">Transfer ID</th>' +
            '<th class="px-3 py-3 font-semibold hidden lg:table-cell">MRN</th>' +
            '<th class="px-3 py-3 font-semibold">Patient</th>' +
            '<th class="px-3 py-3 font-semibold hidden md:table-cell">Pickup location</th>' +
            '<th class="px-3 py-3 font-semibold hidden md:table-cell">' + (isOutbound('internal') ? 'Delivery location' : 'Destination lab') + '</th>' +
            '<th class="px-3 py-3 font-semibold">Status</th>' +
            '<th class="px-3 py-3 font-semibold hidden sm:table-cell">Last update</th>' +
            '<th class="px-5 py-3 font-semibold text-right">Action</th>' +
          '</tr></thead>' +
          '<tbody>' + (rowHtml || emptyRow(8, 'No ' + dirOf('internal') + ' transfers for this lab')) + '</tbody>' +
        '</table></div>' +
        paginationBar(pg.page, pg.totalPages, 'internalPage', pg.total, 'dashPerPage') +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     9b. Internal history — its own page, fuller columns, own filters
     ============================================================ */
  function renderInternalHistory() {
    const mine = myInternal();
    const q = state.histInternalSearch.trim().toLowerCase();
    const allRows = mine
      .filter(t => matchesSearch(t, INTERNAL_SEARCH_FIELDS, 'histInternalSearchField', q))
      .sort(sortTransfers);

    const pg = paginate(allRows, 'histInternalPage', 'histPerPage');
    const anyActive = !!q;

    // Same filter as the dashboard — search only — with the per-page picker
    // sitting parallel to it instead of down in the footer.
    const controls =
      searchControls(INTERNAL_SEARCH_FIELDS, 'histInternalSearchField', 'histInternalSearch') +
      perPageSelect('histPerPage') +
      directionToggle('internal');

    const rowHtml = pg.rows.map(t => {
      const st = formatDateTime(t.createdAt);
      return '<tr class="border-b border-slate-50 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors cursor-pointer" onclick="UD.openDetail(\'' + t.id + '\')">' +
        '<td class="px-5 py-3.5 font-mono text-xs font-semibold text-slate-800 dark:text-slate-200">' + esc(t.id) + '</td>' +
        '<td class="px-3 py-3.5 font-mono text-xs text-slate-500 dark:text-slate-400 hidden lg:table-cell">' + esc(t.mrn) + '</td>' +

  /* ============================================================
     10c. Journeys / waypoints — the stage-by-stage path of one request
     ============================================================ */
  const INT_STAGE_BY_STATUS = { pending: 0, assigned: 1, collected: 2, in_transit: 2, received: 3, completed: 3 };
  const EXT_STAGE_BY_STATUS = { accepted: 1, assigned: 1, in_transit: 2, delivered: 3, cancelled: 0 };

  // Returns the four waypoints of a record with the time each was reached (or null).
  function journeyOf(rec) {
    const isInt = rec.id.indexOf('TRX') === 0;
    const start = isInt ? rec.createdAt : rec.requestedAt;
    const reached = (isInt ? INT_STAGE_BY_STATUS : EXT_STAGE_BY_STATUS)[rec.status] || 0;
    let times;
    if (!start) {
      times = [null, null, null, null];
    } else if (rec.stamps) {
      times = [start, rec.stamps.accepted, rec.stamps.collected, rec.stamps.delivered];
    } else {
      // Older demo rows: same derived stamps the Request Details panel uses.
      const seed = seedOf(rec.id);
      const a = plusMins(start, pick(seed, 0, isInt ? 8 : 10, isInt ? 30 : 40));
      const c = plusMins(a, pick(seed, 1, isInt ? 20 : 35, isInt ? 65 : 95));
      const d = plusMins(c, pick(seed, 2, isInt ? 25 : 40, isInt ? 80 : 125));
      times = [start, a, c, d];
    }
    const labels = isInt
      ? ['Requested', 'Porter assigned', rec.direction === 'outbound' ? 'Left lab' : 'Collected', rec.direction === 'outbound' ? 'At ward' : 'At lab']
      : ['Requested', 'Accepted', 'Collected', 'Delivered'];
    return {
      cancelled: rec.status === 'cancelled',
      stages: labels.map((label, n) => ({ label: label, at: n <= reached ? times[n] : null })),
    };
  }

  const minsBetween = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
  function fmtMins(m) {
    if (m == null || isNaN(m)) return '';
    if (m < 60) return m + ' min' + (m === 1 ? '' : 's');
    const h = Math.floor(m / 60), r = m % 60;
    return h + 'h' + (r ? ' ' + r + 'm' : '');
  }

  // The "Realtime waypoints" line: dots joined by a track, label above each dot,
  // clock time under it, and the minutes between two dots under the track.
  // `stages`: [{label, at, sub?}] — `at` is an ISO time, a preformatted string, or null.
  function waypointLine(stages, opts) {
    opts = opts || {};
    const accent = opts.accent || '#10b981';
    const reachedIdx = stages.reduce((m, s, n) => (s.at ? n : m), -1);
    const node = (s, n) => {
      const on = !!s.at;
      const isCur = n === reachedIdx && n < stages.length - 1 && !opts.cancelled;
      const timeTxt = !s.at ? '--:--' : (s.at.length > 12 ? localTime(new Date(s.at)) : s.at);
      const dot = opts.cancelled && n === reachedIdx + 1
        ? '<span class="wp-dot" style="background:#f43f5e;border-color:#f43f5e">' + i('x', 12, 'text-white') + '</span>'
        : '<span class="wp-dot' + (isCur ? ' wp-pulse' : '') + '" style="' + (on ? 'background:' + accent + ';border-color:' + accent : '') + '"></span>';
      return '<div class="wp-node">' +
        '<span class="wp-label ' + (on ? 'text-slate-700 dark:text-slate-200' : 'text-slate-400') + '">' + esc(opts.cancelled && n === reachedIdx + 1 ? 'Cancelled' : s.label) + '</span>' +
        dot +
        '<span class="wp-time ' + (on ? 'text-slate-800 dark:text-slate-100' : 'text-slate-400') + '">' + esc(timeTxt) + '</span>' +
        (s.sub ? '<span class="text-[10px] text-slate-400 mt-0.5">' + esc(s.sub) + '</span>' : '') +
      '</div>';
    };
    const gap = (a, b) => {
      const on = !!(a.at && b.at);
      const txt = opts.gaps ? opts.gaps.shift() : (on ? fmtMins(minsBetween(a.at, b.at)) : '');
      return '<div class="wp-track"><span class="wp-bar" style="' + (on ? 'background:' + accent : '') + '"></span>' +
        '<span class="wp-gap">' + esc(txt || '') + '</span></div>';
    };
    let html = '';
    stages.forEach((s, n) => { if (n) html += gap(stages[n - 1], s); html += node(s, n); });
    return '<div class="wp-line' + (opts.compact ? ' wp-compact' : '') + '">' + html + '</div>';
  }

  /* ============================================================
     10d. Analytics page
     ============================================================ */
  const AN_LAB_COLORS = {
    Haematology: '#e11d48', Biochemistry: '#2563eb', Microbiology: '#16a34a',
    Cytology: '#f59e0b', Immunology: '#7c3aed', Histopathology: '#0891b2', Other: '#94a3b8',
  };
  const AN_LABS = ['Haematology', 'Biochemistry', 'Microbiology', 'Cytology', 'Immunology', 'Histopathology'];
  const AN_PALETTE = ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#64748b'];
  const AN_PERIODS = [
    { id: '24h', label: 'Last 24 hours', hours: 24 },
    { id: '7d',  label: '7 days',        hours: 24 * 7 },
    { id: '30d', label: '30 days',       hours: 24 * 30 },
    { id: 'all', label: 'All time',      hours: 0 },
  ];

  const anIsInt = () => state.view === 'internal';
  const anTime = (r) => anIsInt() ? r.createdAt : r.requestedAt;
  const anVolume = (r) => Number(r.samples) || 1;
  const anUrgent = (r) => anIsInt() ? r.priority === 'Urgent' : r.urgency === 'urgent';
  // Which of the six labs a record belongs to (Blood Bank sits under Haematology).
  function anLab(r) {
    let l = (anIsInt() && r.direction !== 'outbound') ? r.lab : r.owner;
    if (l === 'Blood Bank') l = 'Haematology';
    return AN_LABS.indexOf(l) > -1 ? l : 'Other';
  }
  // The "other end" of the journey — who referred it in, or where it went out to.
  function anPartner(r) {
    const out = r.direction === 'outbound';
    if (anIsInt()) return out ? r.lab : r.pickup;
    return out ? r.delivery : r.pickup;
  }
  const anSample = (r) => anIsInt() ? r.specimen : r.sampleType;
  const anHour = (r) => new Date(anTime(r)).getHours();

  // How each system splits its traffic in two: community referrals are read as
  // routine vs urgent, St Vincent's referrals as samples going to the lab vs
  // products coming back out of it.
  function anSplit() {
    return anIsInt()
      ? { a: 'Referrals to lab',  b: 'Referrals from lab', colorA: '#3b82f6', colorB: '#8b5cf6', isB: (r) => r.direction === 'outbound' }
      : { a: 'Routine',           b: 'Urgent',             colorA: '#8b5cf6', colorB: '#f43f5e', isB: anUrgent };
  }
  const anSplitOf = (r) => { const s = anSplit(); return s.isB(r) ? s.b : s.a; };

  const AN_DIMS = {
    hour: { get: anHour, label: (v) => pad2(v) + ':00 – ' + pad2(v) + ':59' },
    partner: { get: anPartner, label: (v) => v },
    sample: { get: anSample, label: (v) => v },
    lab: { get: anLab, label: (v) => v },
    split: { get: anSplitOf, label: (v) => v },
  };

  // Everything in the chosen system + period (the whole hospital, not just the
  // signed-in lab, so the "which lab" chart means something).
  function anBase() {
    const feed = anIsInt() ? INTERNAL_FEED : EXTERNAL_FEED;
    const p = AN_PERIODS.find(x => x.id === state.anPeriod) || AN_PERIODS[0];
    let since = p.hours ? Date.now() - p.hours * 3600000 : 0;
    let until = Date.now();
    // "All time" opens a date range; either end can be left blank.
    if (!p.hours) {
      const from = Date.parse(state.anDateFrom + 'T00:00:00');
      const to = Date.parse(state.anDateTo + 'T23:59:59');
      if (!isNaN(from)) since = from;
      if (!isNaN(to)) until = Math.min(until, to);
    }
    return feed.filter(r => {
      const t = new Date(anTime(r)).getTime();
      return t >= since && t <= until;
    });
  }
  // Applies the clicked filter, except on the chart that owns it (that chart keeps
  // its full picture and just highlights the chosen slice).
  function anApply(rows, exceptDim) {
    const f = state.anFilter;
    if (!f || f.dim === exceptDim) return rows;
    return rows.filter(r => String(AN_DIMS[f.dim].get(r)) === String(f.value));
  }

  function setAnalytics(key, value) { state[key] = value; render(); }
  function clearAnalyticsDates() { state.anDateFrom = ''; state.anDateTo = ''; render(); }
  function toggleAnFilter(dim, encoded) {
    const value = decodeURIComponent(encoded);
    const f = state.anFilter;
    state.anFilter = (f && f.dim === dim && String(f.value) === value) ? null : { dim: dim, value: value };
    render();
  }
  const encArg = (v) => encodeURIComponent(String(v)).replace(/'/g, '%27');

  function anChip(active, label, onclick, accentCls) {
    return '<button onclick="' + onclick + '" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ' +
      (active ? accentCls + ' text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700') + '">' + label + '</button>';
  }

  function anKpi(label, value, sub, icon, tone) {
    return '<div class="u-card p-4 flex items-center gap-3">' +
      '<div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 ' + tone + '">' + i(icon, 21) + '</div>' +
      '<div class="min-w-0">' +
        '<p class="text-2xl font-bold text-slate-900 dark:text-white leading-tight">' + value + '</p>' +
        '<p class="text-xs font-medium text-slate-500 dark:text-slate-400">' + label + '</p>' +
        (sub ? '<p class="text-[11px] text-slate-400 mt-0.5 truncate">' + sub + '</p>' : '') +
      '</div>' +
    '</div>';
  }

  function anCard(title, subtitle, body, extra) {
    return '<div class="u-card p-5 flex flex-col">' +
      '<div class="flex items-start justify-between gap-3 mb-4">' +
        '<div><h3 class="text-base font-bold text-slate-900 dark:text-white">' + title + '</h3>' +
        (subtitle ? '<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">' + subtitle + '</p>' : '') + '</div>' +
        (extra || '') +
      '</div>' + body +
    '</div>';
  }

  // ---- 24-hour histogram ------------------------------------------------------
  // Always reads 00 to 23, left to right, whatever period is selected, and always
  // counts samples. The two stacked series come from anSplit().
  function anHistogram(rows) {
    const sp = anSplit();
    const seriesA = new Array(24).fill(0), seriesB = new Array(24).fill(0);
    rows.forEach(r => { const h = anHour(r); (sp.isB(r) ? seriesB : seriesA)[h] += anVolume(r); });
    const totals = seriesA.map((v, h) => v + seriesB[h]);
    const rawMax = Math.max.apply(null, totals.concat([1]));
    const step = rawMax <= 5 ? 1 : rawMax <= 10 ? 2 : rawMax <= 25 ? 5 : rawMax <= 50 ? 10 : rawMax <= 100 ? 20 : Math.ceil(rawMax / 50) * 10;
    const max = Math.ceil(rawMax / step) * step;
    const W = 960, H = 300, L = 44, R = 12, T = 18, B = 34;
    const cw = (W - L - R) / 24, bw = cw * 0.72;
    const y = (v) => T + (H - T - B) * (1 - v / max);
    const sel = state.anFilter && state.anFilter.dim === 'hour' ? Number(state.anFilter.value) : null;
    const nowH = new Date().getHours();

    let g = '';
    for (let v = 0; v <= max; v += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="an-grid"/>' +
           '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="an-axis">' + v + '</text>';
    }
    let bars = '';
    for (let h = 0; h < 24; h++) {
      const x = L + h * cw + (cw - bw) / 2;
      const faded = sel !== null && sel !== h;
      const tip = pad2(h) + ':00–' + pad2(h) + ':59 · ' + totals[h] + ' samples (' +
        seriesA[h] + ' ' + sp.a.toLowerCase() + ', ' + seriesB[h] + ' ' + sp.b.toLowerCase() + ')';
      bars += '<g class="an-bar" style="opacity:' + (faded ? 0.25 : 1) + '" onclick="UD.toggleAnFilter(\'hour\',\'' + h + '\')">' +
        '<title>' + esc(tip) + '</title>' +
        '<rect x="' + (L + h * cw) + '" y="' + T + '" width="' + cw + '" height="' + (H - T - B) + '" fill="transparent"/>' +
        (seriesA[h] ? '<rect x="' + x + '" y="' + y(seriesA[h]) + '" width="' + bw + '" height="' + (y(0) - y(seriesA[h])) + '" rx="3" fill="' + sp.colorA + '"/>' : '') +
        (seriesB[h] ? '<rect x="' + x + '" y="' + y(totals[h]) + '" width="' + bw + '" height="' + (y(0) - y(seriesB[h])) + '" rx="3" fill="' + sp.colorB + '"/>' : '') +
        (totals[h] ? '<text x="' + (x + bw / 2) + '" y="' + (y(totals[h]) - 5) + '" text-anchor="middle" class="an-val">' + totals[h] + '</text>' : '') +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 12) + '" text-anchor="middle" class="an-axis' + (h === nowH && state.anPeriod === '24h' ? ' an-now' : '') + '">' + pad2(h) + '</text>' +
      '</g>';
    }
    const peak = totals.indexOf(Math.max.apply(null, totals));
    const total = totals.reduce((a, b) => a + b, 0);
    const totalA = seriesA.reduce((a, b) => a + b, 0), totalB = seriesB.reduce((a, b) => a + b, 0);
    const selSplit = state.anFilter && state.anFilter.dim === 'split' ? String(state.anFilter.value) : null;
    // Legend rows double as the split filter, so the two halves can be read apart.
    const key = (label, color, value) => {
      const on = selSplit === label;
      return '<button onclick="UD.toggleAnFilter(\'split\',\'' + encArg(label) + '\')" ' +
        'class="inline-flex items-center gap-1.5 px-2 py-1 rounded-lg text-xs transition-colors ' +
        (on ? 'bg-slate-100 dark:bg-slate-800 font-semibold text-slate-700 dark:text-slate-200'
            : 'text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800/60') +
        (selSplit && !on ? ' opacity-50' : '') + '">' +
        '<span class="w-3 h-3 rounded-sm" style="background:' + color + '"></span>' + esc(label) +
        '<span class="tabular-nums text-slate-400">' + value + '</span></button>';
    };
    const legend = '<div class="flex items-center gap-1 flex-wrap">' +
      key(sp.a, sp.colorA, totalA) + key(sp.b, sp.colorB, totalB) + '</div>';

    return anCard('Sample volume by hour of day',
      total ? 'Peak at <b class="text-slate-700 dark:text-slate-200">' + pad2(peak) + ':00</b> with ' + totals[peak] + ' of ' + total + ' samples · click a bar to filter everything below'
            : 'No activity in this period',
      '<div class="w-full overflow-x-auto"><svg viewBox="0 0 ' + W + ' ' + H + '" class="w-full min-w-[640px] h-auto">' + g + bars + '</svg></div>' +
      '<div class="flex items-center justify-between flex-wrap gap-2 mt-2">' + legend +
        '<span class="text-[11px] text-slate-400">Each bar adds up that hour across every day in the period</span></div>');
  }

  // ---- Pie / donut ------------------------------------------------------------
  function anPie(title, subtitle, dim, rows, colorFor) {
    const counts = {};
    rows.forEach(r => { const k = AN_DIMS[dim].get(r) || 'Unknown'; counts[k] = (counts[k] || 0) + anVolume(r); });
    let items = Object.keys(counts).map(k => ({ key: k, value: counts[k] })).sort((a, b) => b.value - a.value);
    if (dim === 'lab') items = AN_LABS.map(l => ({ key: l, value: counts[l] || 0 })).concat(counts.Other ? [{ key: 'Other', value: counts.Other }] : []);
    // Keep the legend short: top 7, the rest rolled into one grey "Other" row.
    if (dim !== 'lab' && items.length > 8) {
      const rest = items.splice(7);
      items.push({ key: '__group', label: 'Other (' + rest.length + ' more)', value: rest.reduce((a, b) => a + b.value, 0), group: true,
                   tip: rest.map(x => x.key + ' ' + x.value).join(', ') });
    }
    const total = items.reduce((a, b) => a + b.value, 0);
    const sel = state.anFilter && state.anFilter.dim === dim ? String(state.anFilter.value) : null;
    items.forEach((it, n) => { it.color = it.group ? '#cbd5e1' : colorFor ? colorFor(it.key, n) : AN_PALETTE[n % AN_PALETTE.length]; });

    const cx = 110, cy = 110, R = 100, r0 = 58;
    let svg = '';
    if (!total) {
      svg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r0) / 2) + '" fill="none" stroke="#e2e8f0" stroke-width="' + (R - r0) + '"/>';
    } else {
      let a0 = -Math.PI / 2;
      items.filter(it => it.value).forEach(it => {
        const frac = it.value / total;
        const a1 = a0 + frac * Math.PI * 2;
        const faded = sel !== null && sel !== it.key;
        const pop = sel === it.key ? 6 : 0;
        const mid = (a0 + a1) / 2, dx = Math.cos(mid) * pop, dy = Math.sin(mid) * pop;
        const tip = (it.label || it.key) + ': ' + it.value + ' (' + Math.round(frac * 100) + '%)' + (it.tip ? ' — ' + it.tip : '');
        const click = it.group ? '' : 'UD.toggleAnFilter(\'' + dim + '\',\'' + encArg(it.key) + '\')';
        if (frac >= 0.9999) {
          svg += '<g class="an-slice" onclick="' + click + '"><title>' + esc(tip) + '</title><circle cx="' + cx + '" cy="' + cy + '" r="' + ((R + r0) / 2) + '" fill="none" stroke="' + it.color + '" stroke-width="' + (R - r0) + '"/></g>';
        } else {
          const p = (a, rad) => [(cx + dx + Math.cos(a) * rad).toFixed(2), (cy + dy + Math.sin(a) * rad).toFixed(2)];
          const large = a1 - a0 > Math.PI ? 1 : 0;
          const [x0, y0] = p(a0, R), [x1, y1] = p(a1, R), [x2, y2] = p(a1, r0), [x3, y3] = p(a0, r0);
          svg += '<g class="an-slice" style="opacity:' + (faded ? 0.28 : 1) + '" onclick="' + click + '"><title>' + esc(tip) + '</title>' +
            '<path d="M' + x0 + ' ' + y0 + ' A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2 + ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + x3 + ' ' + y3 + ' Z" fill="' + it.color + '" class="an-slice-path"/></g>';
        }
        a0 = a1;
      });
    }
    const top = sel ? items.find(it => it.key === sel) : items[0];
    svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" class="an-center-num">' + (sel && top ? top.value : total) + '</text>' +
           '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" class="an-center-lbl">' + (sel ? esc(sel.length > 16 ? sel.slice(0, 15) + '…' : sel) : 'samples') + '</text>';

    const legend = items.map(it => {
      const pct = total ? Math.round(it.value / total * 100) : 0;
      const on = sel === it.key;
      return '<button ' + (it.group ? 'title="' + esc(it.tip) + '" style="cursor:default"' : 'onclick="UD.toggleAnFilter(\'' + dim + '\',\'' + encArg(it.key) + '\')"') + ' class="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg text-left transition-colors ' +
          (on ? 'bg-slate-100 dark:bg-slate-800' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60') + (sel && !on ? ' opacity-50' : '') + '">' +
        '<span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:' + it.color + '"></span>' +
        '<span class="flex-1 min-w-0 text-xs font-medium text-slate-700 dark:text-slate-300 truncate">' + esc(it.label || it.key) + '</span>' +
        '<span class="text-xs text-slate-400 tabular-nums">' + it.value + '</span>' +
        '<span class="w-10 text-right text-xs font-bold text-slate-800 dark:text-slate-100 tabular-nums">' + pct + '%</span>' +
      '</button>';
    }).join('');

    return anCard(title, subtitle,
      '<div class="flex flex-col items-center gap-4">' +
        '<svg viewBox="0 0 220 220" class="w-44 h-44 shrink-0">' + svg + '</svg>' +
        '<div class="w-full space-y-0.5">' + (legend || '<p class="text-xs text-center text-slate-400">No data</p>') + '</div>' +
      '</div>');
  }

  // ---- Average journey (waypoints) ------------------------------------------
  function anJourneyCard(rows) {
    const done = rows.map(journeyOf).filter(j => !j.cancelled && j.stages.every(s => s.at));
    const avgGap = (n) => done.length ? Math.round(done.reduce((a, j) => a + minsBetween(j.stages[n - 1].at, j.stages[n].at), 0) / done.length) : null;
    const gaps = [avgGap(1), avgGap(2), avgGap(3)];
    const totalAvg = gaps.every(g => g != null) ? gaps[0] + gaps[1] + gaps[2] : null;
    const reachedPct = (n) => rows.length ? Math.round(rows.map(journeyOf).filter(j => j.stages[n].at).length / rows.length * 100) : 0;
    const labels = journeyOf(rows[0] || { id: anIsInt() ? 'TRX' : 'H', status: 'pending', direction: 'inbound' }).stages.map(s => s.label);
    let cum = 0;
    const stages = labels.map((label, n) => {
      if (n) cum += gaps[n - 1] || 0;
      return { label: label, at: done.length ? (n ? '+' + fmtMins(cum) : 'Start') : null, sub: reachedPct(n) + '% reached' };
    });
    // Slowest leg gets called out so the reader knows where time is lost.
    const legNames = [labels[0] + ' → ' + labels[1], labels[1] + ' → ' + labels[2], labels[2] + ' → ' + labels[3]];
    const slow = gaps.every(g => g != null) ? gaps.indexOf(Math.max.apply(null, gaps)) : -1;

    const recent = rows.slice().sort((a, b) => new Date(anTime(b)) - new Date(anTime(a))).slice(0, 5);
    const recentHtml = recent.map(r => {
      const j = journeyOf(r);
      return '<button onclick="UD.openDetail(\'' + r.id + '\')" class="w-full text-left p-3 rounded-xl border border-slate-100 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-600 hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">' +
        '<div class="flex items-center justify-between gap-2 mb-1">' +
          '<span class="inline-flex items-center gap-1.5"><span class="font-mono text-xs font-bold text-slate-800 dark:text-slate-100">' + esc(r.id) + '</span>' +
            (anUrgent(r) ? '<span class="text-[10px] font-bold uppercase text-rose-600 bg-rose-50 dark:bg-rose-500/10 px-1.5 py-0.5 rounded">Urgent</span>' : '') + '</span>' +
          '<span class="text-[11px] text-slate-500 dark:text-slate-400 truncate">' + esc(anPartner(r)) + ' · ' + esc(anSample(r)) + ' · ' + esc(anLab(r)) + '</span>' +
        '</div>' +
        waypointLine(j.stages, { compact: true, cancelled: j.cancelled }) +
      '</button>';
    }).join('');

    return '<div class="grid grid-cols-1 xl:grid-cols-5 gap-4">' +
      '<div class="xl:col-span-3">' +
        anCard('Average journey waypoints', done.length ? 'Based on ' + done.length + ' completed ' + (done.length === 1 ? 'journey' : 'journeys') + ' in this view' : 'No completed journeys in this view yet',
          waypointLine(stages, { gaps: gaps.map(g => g == null ? '' : fmtMins(g)), accent: anIsInt() ? '#3b82f6' : '#8b5cf6' }) +
          '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5">' +
            '<div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20">' +
              '<p class="text-[11px] font-semibold uppercase tracking-wide text-emerald-700 dark:text-emerald-300">Average turnaround</p>' +
              '<p class="text-xl font-bold text-emerald-800 dark:text-emerald-200 mt-0.5">' + (totalAvg != null ? fmtMins(totalAvg) : '—') + '</p>' +
              '<p class="text-[11px] text-emerald-700/80 dark:text-emerald-300/80">From request to delivery</p></div>' +
            '<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 border border-amber-100 dark:border-amber-500/20">' +
              '<p class="text-[11px] font-semibold uppercase tracking-wide text-amber-700 dark:text-amber-300">Slowest leg</p>' +
              '<p class="text-xl font-bold text-amber-800 dark:text-amber-200 mt-0.5">' + (slow > -1 ? fmtMins(gaps[slow]) : '—') + '</p>' +
              '<p class="text-[11px] text-amber-700/80 dark:text-amber-300/80">' + (slow > -1 ? esc(legNames[slow]) : 'Not enough data') + '</p></div>' +
          '</div>') +
      '</div>' +
      '<div class="xl:col-span-2">' +
        anCard('Latest journeys', 'Most recent requests in this view · click one for full details',
          '<div class="space-y-2">' + (recentHtml || '<p class="text-xs text-slate-400">Nothing to show.</p>') + '</div>') +
      '</div>' +
    '</div>';
  }

  function renderAnalytics() {
    const isInt = anIsInt();
    const accent = isInt ? 'bg-brand-600' : 'bg-ext-600';
    const base = anBase();
    const all = anApply(base, null);

    // KPIs
    const volume = all.reduce((a, r) => a + anVolume(r), 0);
    const delivered = all.filter(r => isInt ? isDelivered(r) : r.status === 'delivered').length;
    const open = all.filter(r => isInt ? !isDelivered(r) : ['accepted', 'assigned', 'in_transit'].indexOf(r.status) > -1).length;
    const urgentN = all.filter(anUrgent).length;
    const done = all.map(journeyOf).filter(j => !j.cancelled && j.stages.every(s => s.at));
    const tat = done.length ? Math.round(done.reduce((a, j) => a + minsBetween(j.stages[0].at, j.stages[3].at), 0) / done.length) : null;
    const pct = (n) => all.length ? Math.round(n / all.length * 100) : 0;

    const period = AN_PERIODS.find(p => p.id === state.anPeriod) || AN_PERIODS[0];
    // With a date range in play, the KPI strip names the range rather than "All time".
    const periodLabel = (state.anPeriod === 'all' && (state.anDateFrom || state.anDateTo))
      ? (state.anDateFrom || 'Start') + ' → ' + (state.anDateTo || 'Today')
      : period.label;
    const f = state.anFilter;

    // The date range only makes sense once the fixed windows are off, so it appears
    // with "All time" and filters the whole page.
    const dateInput = (key, label) =>
      '<label class="inline-flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">' + esc(label) +
        '<input type="date" class="u-input py-1 text-xs w-36" value="' + esc(state[key]) + '" ' +
          'onchange="UD.setAnalytics(\'' + key + '\', this.value)"></label>';
    const dateRange = state.anPeriod !== 'all' ? '' :
      '<div class="flex items-center gap-2 flex-wrap">' +
        dateInput('anDateFrom', 'From') + dateInput('anDateTo', 'To') +
        ((state.anDateFrom || state.anDateTo)
          ? '<button onclick="UD.clearAnalyticsDates()" class="u-btn-outline text-xs px-2.5 py-1">' + i('x', 12) + 'Clear</button>'
          : '') +
      '</div>';

    const controls = '<div class="u-card p-3 flex flex-col lg:flex-row lg:items-center gap-3">' +
      '<div class="flex items-center gap-2 flex-wrap">' +
        '<div class="inline-flex items-center gap-1 p-1 rounded-lg bg-slate-100 dark:bg-slate-800">' +
          AN_PERIODS.map(p => anChip(state.anPeriod === p.id, p.label, "UD.setAnalytics('anPeriod','" + p.id + "')", accent)).join('') +
        '</div>' +
      '</div>' +
      dateRange +
      '<div class="flex items-center gap-2 lg:ml-auto flex-wrap">' +
        (f ? '<span class="inline-flex items-center gap-2 pl-3 pr-1 py-1 rounded-full text-xs font-semibold bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900">' +
               'Showing only: ' + esc(AN_DIMS[f.dim].label(f.value)) +
               '<button onclick="UD.setAnalytics(\'anFilter\',null)" aria-label="Clear filter" class="w-5 h-5 rounded-full bg-white/20 dark:bg-slate-900/10 flex items-center justify-center">' + i('x', 11) + '</button></span>'
           : '<span class="text-[11px] text-slate-400">Tip: click any bar, slice or legend row to filter the whole page</span>') +
      '</div>' +
    '</div>';

    const kpis = '<div class="grid grid-cols-2 lg:grid-cols-5 gap-4">' +
      anKpi('Requests', all.length, esc(periodLabel), 'package', 'bg-brand-50 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400') +
      anKpi('Samples moved', volume, all.length ? (volume / all.length).toFixed(1) + ' per request' : '', 'flask', 'bg-cyan-50 text-cyan-600 dark:bg-cyan-500/10 dark:text-cyan-400') +
      anKpi('Delivered', pct(delivered) + '%', delivered + ' delivered · ' + open + ' in progress', 'checkCircle', 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10 dark:text-emerald-400') +
      anKpi('Urgent', pct(urgentN) + '%', urgentN + ' urgent requests', 'alert', 'bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-400') +
      anKpi('Avg turnaround', tat != null ? fmtMins(tat) : '—', 'Request → delivery', 'clock', 'bg-amber-50 text-amber-600 dark:bg-amber-500/10 dark:text-amber-400') +
    '</div>';

    const partnerTitle = isInt ? 'Ward / area' : 'Reffering hospital';
    const partnerSub = isInt ? 'Where samples come from or go to inside ' + esc(ORGANISATION)
                             : 'The other hospital on each request';

    const pies = '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">' +
      anPie(partnerTitle, partnerSub, 'partner', anApply(base, 'partner')) +
      anPie('Sample types', 'Samples and products, by volume', 'sample', anApply(base, 'sample')) +
      anPie('Lab referred to', 'Share of volume for each laboratory', 'lab', anApply(base, 'lab'), (k) => AN_LAB_COLORS[k] || AN_LAB_COLORS.Other) +
    '</div>';

    return '<div class="space-y-5 animate-fade-in">' +
      controls + kpis +
      anHistogram(anApply(base, 'hour')) +
      pies +
      anJourneyCard(all) +
    '</div>';
  }

  /* ============================================================
     11. Detail drawer
     ============================================================ */
  function renderDrawer() {
    if (!state.drawerId) return '';
    const isInt = state.drawerId.indexOf('TRX') === 0;
    const rec = isInt ? findInternal(state.drawerId) : findExternal(state.drawerId);
    if (!rec) return '';

    let body;

    if (isInt) {
      const df = internalDetailFields(rec);
      body =
        '<div class="flex items-center gap-2 flex-wrap">' + DirectionBadge(rec.direction) + Badge(INTERNAL_STATUS, rec.status) + PriorityBadge(rec.priority) + '</div>' +

        '<div>' +
          '<div class="flex items-center gap-2 mb-3">' + i('route', 16, 'text-brand-500') + '<h4 class="text-sm font-bold text-slate-900 dark:text-white">Route</h4></div>' +
          '<div class="grid grid-cols-2 gap-4">' +
            field('Pickup location', esc(rec.pickup)) +
            field(rec.direction === 'outbound' ? 'Delivery location' : 'Destination lab', esc(rec.lab)) +
            field('Patient / MRN', esc(rec.patient) + ' <span class="font-mono text-slate-400">(' + esc(rec.mrn) + ')</span>') +
            field('Sample type', esc(rec.specimen) + ' &middot; ' + rec.samples + (rec.samples === 1 ? ' container' : ' containers')) +
          '</div>' +
        '</div>' +

        '<div>' +

  function selectWithOther(label, key, options, placeholder, specifyLabel) {
    const f = state.requestForm;
    const otherKey = key + 'Other';
    const isOther = f[key] === 'Other';
    // Every dropdown in this dashboard reads A–Z, whatever order the source list is in.
    return '<div>' +
      '<label class="u-label">' + label + ' *</label>' +
      '<select class="u-input" onchange="UD.setRequestField(\'' + key + '\', this.value)">' +
        '<option value="">' + esc(placeholder) + '</option>' +
        alpha(options).map(o => '<option value="' + esc(o) + '"' + (f[key] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
        '<option value="Other"' + (isOther ? ' selected' : '') + '>Other</option>' +
      '</select>' +
      (isOther
        ? '<input class="u-input mt-2" value="' + esc(f[otherKey]) + '" placeholder="' + esc(specifyLabel) + '" ' +
          'onchange="UD.setRequestField(\'' + otherKey + '\', this.value)">'
        : '') +
    '</div>';
  }

  /* ============================================================
     14. Render
     ============================================================ */
  function render() {
    const root = document.getElementById('ud-app');
    if (!state.loggedIn) { root.innerHTML = renderLogin(); return; }

    const active = document.activeElement;
    let restore = null;
    if (active && ['INPUT', 'SELECT', 'TEXTAREA'].indexOf(active.tagName) > -1 && root.contains(active)) {
      restore = {
        tag: active.tagName.toLowerCase(),
        onchange: active.getAttribute('onchange'),
        selStart: typeof active.selectionStart === 'number' ? active.selectionStart : null,
        selEnd: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
      };
    }
    const scroller = document.scrollingElement || document.documentElement;
    const top = scroller.scrollTop;

    const isInt = state.view === 'internal';
    const mainContent =
      state.section === 'create'  ? renderCreateRequest() :
      state.section === 'analytics' ? renderAnalytics() :
      state.section === 'history' ? (isInt ? renderInternalHistory() : renderExternalHistory()) :
                                    (isInt ? renderInternal() : renderExternal());
    root.innerHTML = renderShell(mainContent) + renderDrawer() + renderSidebar();
    document.body.style.overflow = (state.drawerId || state.sidebarOpen) ? 'hidden' : '';

    if (restore) {
      const list = document.getElementsByTagName(restore.tag);
      for (let n = 0; n < list.length; n++) {
        if (list[n].getAttribute('onchange') === restore.onchange) {
          list[n].focus({ preventScroll: true });
          if (restore.selStart !== null && list[n].setSelectionRange) {
            try { list[n].setSelectionRange(restore.selStart, restore.selEnd); } catch (e) {}
          }
          break;
        }
      }
    }
    scroller.scrollTop = top;
  }

    setRequestField: setRequestField, resetRequestForm: resetRequestForm, submitRequest: submitRequest,
    markReceived: markReceived,
    setAnalytics: setAnalytics, clearAnalyticsDates: clearAnalyticsDates, toggleAnFilter: toggleAnFilter,
  };

  if (document.addEventListener) {
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && state.drawerId) closeDetail();
    });
  }

  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    // Sessions saved before lab scoping have no `lab` — drop them so the user signs in again.
    if (saved && saved.loginName && saved.user && saved.user.lab) {
      state.loggedIn = true;
      state.loginName = saved.loginName;
      state.user = saved.user;
      const acct = Object.keys(CREDENTIALS).map(k => CREDENTIALS[k]).find(a => a.persona === 'lab' && a.name === saved.loginName);
      if (acct && acct.lab && state.user.lab !== acct.lab) {
        state.user.lab = acct.lab;
        localStorage.setItem(SESSION_KEY, JSON.stringify({ loginName: state.loginName, user: state.user }));
      }
    } else if (saved) {
      localStorage.removeItem(SESSION_KEY);
    }
  } catch (e) { localStorage.removeItem(SESSION_KEY); }

  render();
})();
</script>
<script>
  /* ============================================================
     App shell — decides which of the two systems is on screen.

     Theatre and Porters use the LabTrack MVP (#app). Laboratory staff use the
     Unified Dashboard (#ud-app). Both render on load; only one is shown. The
     handover in either direction writes the right session key and reloads, so
     each system still boots exactly the way it did as a standalone file.
     ============================================================ */
  (function () {
    function hasMvpSession() {
      try {
        var s = JSON.parse(localStorage.getItem('labtrack_session') || 'null');
        return !!(s && s.persona);
      } catch (e) { return false; }
    }
    var mvpRoot = document.getElementById('app');
    var udRoot = document.getElementById('ud-app');
    var showMvp = hasMvpSession();
    if (mvpRoot) mvpRoot.style.display = showMvp ? '' : 'none';
    if (udRoot) udRoot.style.display = showMvp ? 'none' : '';
  })();
</script>
</body>
</html>
